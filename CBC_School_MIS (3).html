<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBC School MIS</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mut:#66727f;--line:#dfe4e9;--pri:#0b6e83;--pri-ink:#fff;--soft:#e2f2f5;--warn:#b45309;--ok:#157347;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mut:#93a1ae;--line:#2a3541;--pri:#4cc3d9;--pri-ink:#082a32;--soft:#16323a;--warn:#f0a65a;--ok:#5cc58c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19222b;--ink:#e8edf2;--mut:#93a1ae;--line:#2a3541;--pri:#4cc3d9;--pri-ink:#082a32;--soft:#16323a;--warn:#f0a65a;--ok:#5cc58c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:16px}.sp{flex:1}
a.crumb{color:var(--pri);cursor:pointer;font-weight:600}
button,select,input{font:inherit;color:inherit}
button{background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.d{background:transparent;color:var(--warn);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px}
main{max-width:1100px;margin:0 auto;padding:20px 18px}
h2{margin:0 0 4px;font-size:21px}h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer}
.tile:hover{border-color:var(--pri)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;margin:0 auto 8px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:6px}.app .row{display:flex;gap:10px;align-items:center}
.app p{margin:0;color:var(--mut);font-size:13px;flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--pri);margin:2px 4px 0 0}
.tag.w{color:var(--warn)}
.lay{display:grid;grid-template-columns:190px 1fr;gap:18px}
nav.side a{display:block;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav.side a.on{background:var(--soft);color:var(--pri);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.chk input{width:auto;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
@media print{header,.noprint,nav.side{display:none!important}}@media(max-width:700px){.lay{grid-template-columns:1fr}nav.side{display:flex;overflow-x:auto;gap:4px}nav.side a{white-space:nowrap}}
</style>
</head>
<body>
<header><b id="hname">School MIS</b><a class="crumb" id="bc"></a><span class="sp"></span><button class="g" onclick="go('home')">Apps</button><button class="g" onclick="go('apps')">Manage apps</button></header>
<main id="main"></main>
<div id="toast"></div>

\n  }\n  .btn:hover{background:var(--green-700);}\n  .btn.brass{background:var(--brass); }\n  .btn.brass:hover{background:#9C3C31;}\n  .btn.ghost{\n    background:transparent;\n    color:var(--green-800);\n    border:1px solid var(--line-strong);\n  }\n  .btn.ghost:hover{background:#E6EEF3;}\n  .btn.danger{background:transparent; color:var(--brick); border:1px solid #DEB9B4;}\n  .btn.danger:hover{background:var(--brick-bg);}\n  .btn:disabled{opacity:.45; cursor:not-allowed;}\n  .btn.small{padding:5px 10px; font-size:12px;}\n\n  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}\n\n  .panel{\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    box-shadow:var(--shadow);\n    padding:20px 22px;\n    margin-bottom:22px;\n  }\n  .panel h3{font-size:15px; margin-bottom:4px;}\n  .panel .hint{color:#647380; font-size:12.5px; margin-bottom:16px;}\n\n  .grid-form{\n    display:grid;\n    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));\n    gap:12px 16px;\n    margin-bottom:14px;\n  }\n  label{\n    display:block;\n    font-size:11.5px;\n    text-transform:uppercase;\n    letter-spacing:.5px;\n    color:#5C6B77;\n    margin-bottom:5px;\n    font-weight:600;\n  }\n  input, select, textarea{\n    width:100%;\n    padding:8px 10px;\n    border:1px solid var(--line-strong);\n    border-radius:var(--radius);\n    font-family:inherit;\n    font-size:13.5px;\n    background:#FEFEFC;\n    color:var(--ink);\n  }\n  input:focus, select:focus, textarea:focus{\n    outline:2px solid var(--brass-light);\n    outline-offset:1px;\n    border-color:var(--brass);\n  }\n  fieldset{border:1px dashed var(--line-strong); border-radius:var(--radius); padding:14px 16px; margin:0 0 14px;}\n  legend{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:#5C6B77; padding:0 6px; font-weight:600;}\n\n  table{width:100%; border-collapse:collapse; font-size:13px;}\n  th,td{\n    text-align:left;\n    padding:9px 10px;\n    border-bottom:1px solid var(--line);\n    vertical-align:middle;\n  }\n  thead th{\n    font-size:11px;\n    text-transform:uppercase;\n    letter-spacing:.4px;\n    color:#5C6B77;\n    border-bottom:1.5px solid var(--ink);\n    font-weight:600;\n  }\n  tbody tr:hover{background:#F3F8FB;}\n  .tag{\n    display:inline-block;\n    background:#E6EEF3;\n    border:1px solid var(--line-strong);\n    color:#3E4C56;\n    padding:2px 8px;\n    border-radius:12px;\n    font-size:11.5px;\n    margin:2px 3px 2px 0;\n  }\n  .empty{\n    text-align:center;\n    padding:34px 20px;\n    color:#7C8B96;\n    border:1px dashed var(--line-strong);\n    border-radius:var(--radius);\n    font-size:13.5px;\n  }\n  .row-actions{display:flex; gap:6px;}\n  .icon-btn{\n    all:unset; cursor:pointer; color:#5C6B77; font-size:12.5px;\n    padding:4px 7px; border-radius:var(--radius);\n  }\n  .icon-btn:hover{background:#E6EEF3; color:var(--ink);}\n  .icon-btn.del:hover{background:var(--brick-bg); color:var(--brick);}\n\n  .stat-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px;}\n  .stat{\n    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);\n    padding:16px 18px;\n  }\n  .stat .n{font-family:'Lora',serif; font-size:26px; font-weight:700; color:var(--green-800);}\n  .stat .l{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:#647380; margin-top:2px;}\n\n  .banner{\n    display:flex; gap:10px; align-items:flex-start;\n    padding:12px 14px; border-radius:var(--radius); font-size:13px; margin-bottom:16px;\n  }\n  .banner.ok{background:var(--ok-bg); color:#1B4A63; border:1px solid #BFDAE8;}\n  .banner.warn{background:var(--brick-bg); color:#73281F; border:1px solid #E6C0BB;}\n\n  /* Timetable grid */\n  .tt-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius);}\n  table.tt{min-width:760px;}\n  table.tt th, table.tt td{border:1p /button>\n    <\/div>\n  <\/aside>\n\n  <main id=\"mainView\"><\/main>\n\n<\/div>\n\n<input type=\"file\" id=\"importFile\" accept=\"application/json\" style=\"display:none\">\n\n<script>\n(function(){\n\"use strict\";\n\n/* =========================================================\n   STATE & PERSISTENCE\n   ========================================================= */\nconst STORE_KEY = \"mukumu_tt_v1\";\n\nconst DEFAULT_STATE = {\n  config:{\n    days:[\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\"],\n    periods:[\n      {id:\"p1\", label:\"1\", time:\"8:00–8:40\", type:\"lesson\"},\n      {id:\"p2\", label:\"2\", time:\"8:40–9:20\", type:\"lesson\"},\n      {id:\"p3\", label:\"3\", time:\"9:20–10:00\", type:\"lesson\"},\n      {id:\"break1\", label:\"Break\", time:\"10:00–10:20\", type:\"break\"},\n      {id:\"p4\", label:\"4\", time:\"10:20–11:00\", type:\"lesson\"},\n      {id:\"p5\", label:\"5\", time:\"11:00–11:40\", type:\"lesson\"},\n      {id:\"p6\", label:\"6\", time:\"11:40–12:20\", type:\"lesson\"},\n      {id:\"lunch\", label:\"Lunch\", time:\"12:20–13:20\", type:\"break\"},\n      {id:\"p7\", label:\"7\", time:\"13:20–14:00\", type:\"lesson\"},\n      {id:\"p8\", label:\"8\", time:\"14:00–14:40\", type:\"lesson\"}\n    ]\n  },\n  teachers:[],\n  subjects:[],\n  rooms:[],\n  classes:[],\n  schedule:null,   // { entries:[{classId, subjectId, teacherId, roomId, day, periodId}], unscheduled:[...], generatedAt }\n};\n\nlet state = loadState();\n\nfunction loadState(){\n  try{\n    const raw = localStorage.getItem(STORE_KEY);\n    if(raw){\n      const parsed = JSON.parse(raw);\n      return Object.assign(structuredClone(DEFAULT_STATE), parsed);\n    }\n  }catch(e){ console.warn(\"Could not load saved data\", e); }\n  return structuredClone(DEFAULT_STATE);\n}\nfunction saveState(){\n  localStorage.setItem(STORE_KEY, JSON.stringify(state));\n}\nfunction uid(prefix){\n  return prefix + \"_\" + Math.random().toString(36).slice(2,9);\n}\n\n/* =========================================================\n   NAVIGATION\n   ========================================================= */\nconst TABS = [\n  {id:\"dashboard\", label:\"Dashboard\"},\n  {id:\"teachers\",  label:\"Teachers\"},\n  {id:\"subjects\",  label:\"Subjects\"},\n  {id:\"rooms\",     label:\"Rooms\"},\n  {id:\"classes\",   label:\"Classes & Load\"},\n  {id:\"timeslots\", label:\"Time Structure\"},\n  {id:\"generate\",  label:\"Generate Timetable\"},\n  {id:\"view\",      label:\"View Timetable\"},\n  {id:\"reports\",   label:\"Reports\"}\n];\nlet activeTab = \"dashboard\";\n\nfunction renderNav(){\n  const nav = document.getElementById(\"tabNav\");\n  nav.innerHTML = \"\";\n  TABS.forEach((t, i)=>{\n    const b = document.createElement(\"button\");\n    b.className = \"tab-btn\" + (t.id===activeTab ? \" active\":\"\");\n    b.innerHTML = `<span class=\"num\">${String(i+1).padStart(2,\"0\")}<\/span><span>${t.label}<\/span>`;\n    b.onclick = ()=>{ activeTab = t.id; render(); };\n    nav.appendChild(b);\n  });\n}\n\nfunction esc(s){\n  return String(s==null?\"\":s).replace(/[&<>\"']/g, c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n}\n\n/* =========================================================\n   LOOKUP HELPERS\n   ========================================================= */\nconst teacherName = id => (state.teachers.find(t=>t.id===id)||{}).name || \"—\";\nconst subjectName = id => (state.subjects.find(s=>s.id===id)||{}).name || \"—\";\nconst subjectCode = id => (state.subjects.find(s=>s.id===id)||{}).code || \"\";\nconst roomName    = id => (state.rooms.find(r=>r.id===id)||{}).name || \"Unassigned\";\nconst className   = id => (state.classes.find(c=>c.id===id)||{}).name || \"—\";\nconst lessonPeriods = () => state.config.periods.filter(p=>p.type===\"lesson\");\n\n/* =========================================================\n   RENDER ROUTER\n   ========================================================= */\nfunction render(){\n  renderNav();\n  const main = document.getElementById(\"mainView\");\n  const renderers = {\n    dashboard: renderDashboard,\n    teachers: renderTeachers,\n    subjects: renderSubjects,\n    rooms: renderRooms,\n    classes: renderClasses,\n    timeslots: renderTimeslots,\n    generate: renderGenerate,\n    view: renderView,\n    reports: renderReports\n  };\n  main.innerHTML = \"\";\n  (renderers[activeTab] || renderDashboard)(main);\n}\n\nfunction pageHead(main, title, sub, actionsHtml){\n  const head = document.createElement(\"div\");\n  head.className = \"page-head\";\n  head.innerHTML = `<div><h2>${title}<\/h2><div class=\"sub\">${sub||\"\"}<\/div><\/div><div class=\"toolbar\" style=\"margin:0;\">${actionsHtml||\"\"}<\/div>`;\n  main.appendChild(head);\n}\n\n/* =========================================================\n   DASHBOARD\n   ========================================================= */\nfunction renderDashboard(main){\n  pageHead(main, \"Dashboard\", \"Institute overview and scheduling objectives.\");\n\n  const totalPeriodsNeeded = state.classes.reduce((sum,c)=> sum + c.load.reduce((s,l)=>s+Number(l.periodsPerWeek||0),0), 0);\n  const scheduled = state.schedule ? state.schedule.entries.length : 0;\n\n  const stats = document.createElement(\"div\");\n  stats.className = \"stat-strip\";\n  stats.innerHTML = [\n    [\"Teachers\", state.teachers.length],\n    [\"Subjects\", state.subjects.length],\n    [\"Rooms\", state.rooms.length],\n    [\"Classes\", state.classes.length],\n    [\"Periods required / wk\", totalPeriodsNeeded],\n    [\"Periods scheduled\", scheduled],\n  ].map(([l,n])=>`<div class=\"stat\"><div class=\"n\">${n}<\/div><div class=\"l\">${l}<\/div><\/div>`).join(\"\");\n  main.appendChild(stats);\n\n  const panel = document.createElement(\"div\");\n  panel.className = \"panel\";\n  panel.innerHTML = `\n    <h3>Objectives of this system<\/h3>\n    <div class=\"hint\">The workflow below (left sidebar) is built to satisfy each of these directly.<\/div>\n    <table>\n      <tbody>\n        <tr><td style=\"width:26px;color:var(--brass);font-family:'Lora',serif;font-weight:700;\">i.<\/td><td>Minimise student time conflicts within the organisation<\/td><\/tr>\n        <tr><td style=\"color:var(--brass);font-family:'Lora',serif;font-weight:700;\">ii.<\/td><td>Optimise resource and room allocation<\/td><\/tr>\n        <tr><td style=\"color:var(--brass);font-family:'Lora',serif;font-weight:700;\">iii.<\/td><td>Simplify the process of scheduling classes and exams<\/td><\/tr>\n        <tr><td style=\"color:var(--brass);font-family:'Lora',serif;font-weight:700;\">iv.<\/td><td>Efficiently create and manage schedules<\/td><\/tr>\n        <tr><td style=\"color:var(--brass);font-family:'Lora',serif;font-weight:700;\">v.<\/td><td>Generate a timetable report<\/td><\/tr>\n      <\/tbody>\n    <\/table>`;\n  main.appendChild(panel);\n\n  const steps = document.createElement(\"div\");\n  steps.className = \"panel\";\n  const done = (cond)=> cond ? \"✓\" : \"○\";\n  steps.innerHTML = `\n    <h3>Getting started<\/h3>\n    <div class=\"hint\">Set up your data in order, then generate the timetable.<\/div>\n    <table><tbody>\n      <tr><td>${done(state.teachers.length)}<\/td><td>Add teachers<\/td><td><button class=\"btn ghost small\" data-go=\"teachers\">Open<\/button><\/td><\/tr>\n      <tr><td>${done(state.subjects.length)}<\/td><td>Add subjects<\/td><td><button class=\"btn ghost small\" data-go=\"subjects\">Open<\/button><\/td><\/tr>\n      <tr><td>${done(state.rooms.length)}<\/td><td>Add rooms<\/td><td><button class=\"btn ghost small\" data-go=\"rooms\">Open<\/button><\/td><\/tr>\n      <tr><td>${done(state.classes.length)}<\/td><td>Add classes and assign teaching load<\/td><td><button class=\"btn ghost small\" data-go=\"classes\">Open<\/button><\/td><\/tr>\n      <tr><td>${done(state.schedule)}<\/td><td>Generate the timetable<\/td><td><button class=\"btn ghost small\" data-go=\"generate\">Open<\/button><\/td><\/tr>\n    <\/tbody><\/table>`;\n  steps.querySelectorAll(\"[data-go]\").forEach(b=> b.onclick = ()=>{ activeTab=b.dataset.go; render(); });\n  main.appendChild(steps);\n}\n\n/* =========================================================\n   TEACHERS\n   ========================================================= */\nfunction renderTeachers(main){\n  pageHead(main, \"Teachers\", \"Manage teaching staff and the subjects each one can teach.\");\n\n  const form = document.createElement(\"div\");\n  form.className = \"panel\";\n  form.innerHTML = `\n    <h3>Add teacher<\/h3>\n    <div class=\"hint\">Name and initials, plus which subjects they are qualified to teach.<\/div>\n    <div class=\"grid-form\">\n      <div><label>Full name<\/label><input id=\"t_name\" placeholder=\"e.g. J. Wanjala\"><\/div>\n      <div><label>Initials / code<\/label><input id=\"t_code\" placeholder=\"e.g. JW\"><\/div>\n      <div><label>Max periods / week<\/label><input id=\"t_max\" type=\"number\" min=\"1\" value=\"27\"><\/div>\n    <\/div>\n    <div><label>Subjects taught<\/label>\n      <select id=\"t_subjects\" multiple size=\"4\" style=\"height:auto;\">\n        ${state.subjects.map(s=>`<option value=\"${s.id}\">${esc(s.name)}<\/option>`).join(\"\") || `<option disabled>Add subjects first<\/option>`}\n      <\/select>\n    <\/div>\n    <div style=\"margin-top:14px;\"><button class=\"btn\" id=\"addTeacherBtn\">Add teacher<\/button><\/div>\n  `;\n  main.appendChild(form);\n  form.querySelector(\"#addTeacherBtn\").onclick = ()=>{\n    const name = form.querySelector(\"#t_name\").value.trim();\n    const code = form.querySelector(\"#t_code\").value.trim();\n    const max = Number(form.querySelector(\"#t_max\").value)||27;\n    const subs = Array.from(form.querySelector(\"#t_subjects\").selectedOptions).map(o=>o.value);\n    if(!name){ alert(\"Please enter the teacher's name.\"); return; }\n    state.teachers.push({id:uid(\"tea\"), name, code, maxPeriods:max, subjects:subs});\n    saveState(); render();\n  };\n\n  const listPanel = document.createElement(\"div\");\n  listPanel.className = \"panel\";\n  if(state.teachers.length===0){\n    listPanel.innerHTML = `<div class=\"empty\">No teachers yet. Add your first teacher above.<\/div>`;\n  }else{\n    listPanel.innerHTML = `\n      <table>\n        <thead><tr><th>Name<\/th><th>Code<\/th><th>Subjects<\/th><th>Max/wk<\/th><th><\/th><\/tr><\/thead>\n        <tbody>\n        ${state.teachers.map(t=>`\n          <tr>\n            <td>${esc(t.name)}<\/td>\n            <td>${esc(t.code||\"—\")}<\/td>\n            <td>${(t.subjects||[]).map(id=>`<span class=\"tag\">${esc(subjectName(id))}<\/span>`).join(\"\") || \"—\"}<\/td>\n            <td>${t.maxPeriods}<\/td>\n            <td class=\"row-actions\"><button class=\"icon-btn del\" data-id=\"${t.id}\">Remove<\/button><\/td>\n          <\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>`;\n    listPanel.querySelectorAll(\".del\").forEach(b=>{\n      b.onclick = ()=>{\n        if(!confirm(\"Remove this teacher?\")) return;\n        state.teachers = state.teachers.filter(t=>t.id!==b.dataset.id);\n        saveState(); render();\n      };\n    });\n  }\n  main.appendChild(listPanel);\n}\n\n/* =========================================================\n   SUBJECTS\n   ========================================================= */\nfunction renderSubjects(main){\n  pageHead(main, \"Subjects\", \"The subject list feeds every dropdown elsewhere in the system.\");\n\n  const form = document.createElement(\"div\");\n  form.className = \"panel\";\n  form.innerHTML = `\n    <h3>Add subject<\/h3>\n    <div class=\"grid-form\">\n      <div><label>Subject name<\/label><input id=\"s_name\" placeholder=\"e.g. Mathematics\"><\/div>\n      <div><label>Code<\/label><input id=\"s_code\" placeholder=\"e.g. MAT\"><\/div>\n      <div><label>Needs a special room?<\/label>\n        <select id=\"s_special\">\n          <option value=\"\">No — any classroom<\/option>\n          ${state.rooms.filter(r=>r.type!==\"classroom\").map(r=>`<option value=\"${r.id}\">${esc(r.name)}<\/option>`).join(\"\")}\n        <\/select>\n      <\/div>\n    <\/div>\n    <button class=\"btn\" id=\"addSubjectBtn\">Add subject<\/button>\n  `;\n  main.appendChild(form);\n  form.querySelector(\"#addSubjectBtn\").onclick = ()=>{\n    const name = form.querySelector(\"#s_name\").value.trim();\n    const code = form.querySelector(\"#s_code\").value.trim();\n    const special = form.querySelector(\"#s_special\").value || null;\n    if(!name){ alert(\"Please enter a subject name.\"); return; }\n    state.subjects.push({id:uid(\"sub\"), name, code, specialRoomId:special});\n    saveState(); render();\n  };\n\n  const listPanel = document.createElement(\"div\");\n  listPanel.className = \"panel\";\n  if(state.subjects.length===0){\n    listPanel.innerHTML = `<div class=\"empty\">No subjects yet. Add your first subject above.<\/div>`;\n  }else{\n    listPanel.innerHTML = `\n      <table>\n        <thead><tr><th>Subject<\/th><th>Code<\/th><th>Required room type<\/th><th><\/th><\/tr><\/thead>\n        <tbody>\n        ${state.subjects.map(s=>`\n          <tr>\n            <td>${esc(s.name)}<\/td>\n            <td>${esc(s.code||\"—\")}<\/td>\n            <td>${s.specialRoomId ? esc(roomName(s.specialRoomId)) : \"Any classroom\"}<\/td>\n            <td class=\"row-actions\"><button class=\"icon-btn del\" data-id=\"${s.id}\">Remove<\/button><\/td>\n          <\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>`;\n    listPanel.querySelectorAll(\".del\").forEach(b=>{\n      b.onclick = ()=>{\n        if(!confirm(\"Remove this subject? It will also be removed from teacher and class assignments.\")) return;\n        const id = b.dataset.id;\n        state.subjects = state.subjects.filter(s=>s.id!==id);\n        state.teachers.forEach(t=> t.subjects = (t.subjects||[]).filter(sid=>sid!==id));\n        state.classes.forEach(c=> c.load = (c.load||[]).filter(l=>l.subjectId!==id));\n        saveState(); render();\n      };\n    });\n  }\n  main.appendChild(listPanel);\n}\n\n/* =========================================================\n   ROOMS\n   ========================================================= */\nfunction renderRooms(main){\n  pageHead(main, \"Rooms\", \"Physical spaces available for allocation — classrooms, labs, and other special rooms.\");\n\n  const form = document.createElement(\"div\");\n  form.className = \"panel\";\n  form.innerHTML = `\n    <h3>Add room<\/h3>\n    <div class=\"grid-form\">\n      <div><label>Room name<\/label><input id=\"r_name\" placeholder=\"e.g. Room 4 / Physics Lab\"><\/div>\n      <div><label>Type<\/label>\n        <select id=\"r_type\">\n          <option value=\"classroom\">Classroom<\/option>\n          <option value=\"lab\">Laboratory<\/option>\n          <option value=\"hall\">Hall<\/option>\n          <option value=\"other\">Other<\/option>\n        <\/select>\n      <\/div>\n      <div><label>Capacity<\/label><input id=\"r_cap\" type=\"number\" min=\"1\" value=\"45\"><\/div>\n    <\/div>\n    <button class=\"btn\" id=\"addRoomBtn\">Add room<\/button>\n  `;\n  main.appendChild(form);\n  form.querySelector(\"#addRoomBtn\").onclick = ()=>{\n    const name = form.querySelector(\"#r_name\").value.trim();\n    const type = form.querySelector(\"#r_type\").value;\n    const cap = Number(form.querySelector(\"#r_cap\").value)||0;\n    if(!name){ alert(\"Please enter a room name.\"); return; }\n    state.rooms.push({id:uid(\"room\"), name, type, capacity:cap});\n    saveState(); render();\n  };\n\n  const listPanel = document.createElement(\"div\");\n  listPanel.className = \"panel\";\n  if(state.rooms.length===0){\n    listPanel.innerHTML = `<div class=\"empty\">No rooms yet. Add your first room above.<\/div>`;\n  }else{\n    listPanel.innerHTML = `\n      <table>\n        <thead><tr><th>Room<\/th><th>Type<\/th><th>Capacity<\/th><th><\/th><\/tr><\/thead>\n        <tbody>\n        ${state.rooms.map(r=>`\n          <tr>\n            <td>${esc(r.name)}<\/td>\n            <td style=\"text-transform:capitalize;\">${esc(r.type)}<\/td>\n            <td>${r.capacity}<\/td>\n            <td class=\"row-actions\"><button class=\"icon-btn del\" data-id=\"${r.id}\">Remove<\/button><\/td>\n          <\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>`;\n    listPanel.querySelectorAll(\".del\").forEach(b=>{\n      b.onclick = ()=>{\n        if(!confirm(\"Remove this room?\")) return;\n        const id = b.dataset.id;\n        state.rooms = state.rooms.filter(r=>r.id!==id);\n        state.classes.forEach(c=>{ if(c.homeRoomId===id) c.homeRoomId=null; });\n        state.subjects.forEach(s=>{ if(s.specialRoomId===id) s.specialRoomId=null; });\n        saveState(); render();\n      };\n    });\n  }\n  main.appendChild(listPanel);\n}\n\n/* =========================================================\n   CLASSES & TEACHING LOAD\n   ========================================================= */\nfunction renderClasses(main){\n  pageHead(main, \"Classes & Load\", \"Each class (stream) has a home room and a weekly subject load, each taught by one teacher.\");\n\n  const form = document.createElement(\"div\");\n  form.className = \"panel\";\n  form.innerHTML = `\n    <h3>Add class / stream<\/h3>\n    <div class=\"grid-form\">\n      <div><label>Class name<\/label><input id=\"c_name\" placeholder=\"e.g. Form 2 East\"><\/div>\n      <div><label>Home room<\/label>\n        <select id=\"c_room\">\n          <option value=\"\">— none —<\/option>\n          ${state.rooms.map(r=>`<option value=\"${r.id}\">${esc(r.name)}<\/option>`).join(\"\")}\n        <\/select>\n      <\/div>\n      <div><label>Learners<\/label><input id=\"c_size\" type=\"number\" min=\"1\" value=\"40\"><\/div>\n    <\/div>\n    <button class=\"btn\" id=\"addClassBtn\">Add class<\/button>\n  `;\n  form.querySelector(\"#addClassBtn\").onclick = ()=>{\n    const name = form.querySelector(\"#c_name\").value.trim();\n    const room = form.querySelector(\"#c_room\").value || null;\n    const size = Number(form.querySelector(\"#c_size\").value)||0;\n    if(!name){ alert(\"Please enter a class name.\"); return; }\n    state.classes.push({id:uid(\"cls\"), name, homeRoomId:room, size, load:[]});\n    saveState(); render();\n  };\n  main.appendChild(form);\n\n  if(state.classes.length===0){\n    const empty = document.createElement(\"div\");\n    empty.className = \"panel\";\n    empty.innerHTML = `<div class=\"empty\">No classes yet. Add your first class above.<\/div>`;\n    main.appendChild(empty);\n    return;\n  }\n\n  state.classes.forEach(c=>{\n    const panel = document.createElement(\"div\");\n    panel.className = \"panel\";\n    const totalLoad = c.load.reduce((s,l)=>s+Number(l.periodsPerWeek||0),0);\n    panel.innerHTML = `\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n        <div>\n          <h3>${esc(c.name)}<\/h3>\n          <div class=\"hint\">Home room: ${c.homeRoomId? esc(roomName(c.homeRoomId)) : \"none\"} · ${c.size} learners · ${totalLoad} periods/wk assigned<\/div>\n        <\/div>\n        <button class=\"icon-btn del\" data-id=\"${c.id}\">Remove class<\/button>\n      <\/div>\n\n      <fieldset>\n        <legend>Add subject to load<\/legend>\n        <div class=\"grid-form\">\n          <div><label>Subject<\/label>\n            <select class=\"l_subject\">\n              ${state.subjects.map(s=>`<option value=\"${s.id}\">${esc(s.name)}<\/option>`).join(\"\") || `<option disabled>Add subjects first<\/option>`}\n            <\/select>\n          <\/div>\n          <div><label>Teacher<\/label>\n            <select class=\"l_teacher\">\n              <option value=\"\">— unassigned —<\/option>\n              ${state.teachers.map(t=>`<option value=\"${t.id}\">${esc(t.name)}<\/option>`).join(\"\")}\n            <\/select>\n          <\/div>\n          <div><label>Periods / week<\/label><input class=\"l_periods\" type=\"number\" min=\"1\" value=\"4\"><\/div>\n        <\/div>\n        <button class=\"btn ghost small add-load\">Add to load<\/button>\n      <\/fieldset>\n\n      ${c.load.length ? `\n      <table>\n        <thead><tr><th>Subject<\/th><th>Teacher<\/th><th>Periods/wk<\/th><th><\/th><\/tr><\/thead>\n        <tbody>\n          ${c.load.map((l,idx)=>`\n            <tr>\n              <td>${esc(subjectName(l.subjectId))}<\/td>\n              <td>${l.teacherId? esc(teacherName(l.teacherId)) : `<span style=\"color:var(--brick);\">unassigned<\/span>`}<\/td>\n              <td>${l.periodsPerWeek}<\/td>\n              <td class=\"row-actions\"><button class=\"icon-btn del\" data-idx=\"${idx}\">Remove<\/button><\/td>\n            <\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>` : `<div class=\"empty\">No subjects in this class's load yet.<\/div>`}\n    `;\n\n    panel.querySelector(\".del[data-id]\").onclick = ()=>{\n      if(!confirm(`Remove class \"${c.name}\"?`)) return;\n      state.classes = state.classes.filter(x=>x.id!==c.id);\n      saveState(); render();\n    };\n    panel.querySelector(\".add-load\").onclick = ()=>{\n      const subjectId = panel.querySelector(\".l_subject\").value;\n      const teacherId = panel.querySelector(\".l_teacher\").value || null;\n      const periodsPerWeek = Number(panel.querySelector(\".l_periods\").value)||1;\n      if(!subjectId){ alert(\"Add a subject first.\"); return; }\n      c.load.push({subjectId, teacherId, periodsPerWeek});\n      saveState(); render();\n    };\n    panel.querySelectorAll(\"td .del[data-idx]\").forEach(b=>{\n      b.onclick = ()=>{\n        c.load.splice(Number(b.dataset.idx),1);\n        saveState(); render();\n      };\n    });\n\n    main.appendChild(panel);\n  });\n}\n\n/* =========================================================\n   TIME STRUCTURE\n   ========================================================= */\nfunction renderTimeslots(main){\n  pageHead(main, \"Time Structure\", \"Define the school week: teaching days and the daily period grid.\");\n\n  const panel = document.createElement(\"div\");\n  panel.className = \"panel\";\n  panel.innerHTML = `\n    <h3>Teaching days<\/h3>\n    <div class=\"hint\">Untick a day to exclude it from scheduling (e.g. no lessons on Friday afternoon activities day).<\/div>\n    <div id=\"daysBox\"><\/div>\n  `;\n  main.appendChild(panel);\n  const ALL_DAYS = [\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\n  const daysBox = panel.querySelector(\"#daysBox\");\n  daysBox.innerHTML = ALL_DAYS.map(d=>`\n    <label style=\"display:inline-flex;align-items:center;gap:6px;margin-right:18px;text-transform:none;font-size:13px;color:var(--ink);font-weight:400;\">\n      <input type=\"checkbox\" value=\"${d}\" ${state.config.days.includes(d)?\"checked\":\"\"}> ${d}\n    <\/label>`).join(\"\");\n  daysBox.querySelectorAll(\"input\").forEach(cb=>{\n    cb.onchange = ()=>{\n      const checked = Array.from(daysBox.querySelectorAll(\"input:checked\")).map(c=>c.value);\n      state.config.days = ALL_DAYS.filter(d=>checked.includes(d));\n      saveState();\n    };\n  });\n\n  const pPanel = document.createElement(\"div\");\n  pPanel.className = \"panel\";\n  pPanel.innerHTML = `\n    <h3>Daily periods<\/h3>\n    <div class=\"hint\">Add lesson periods or break/lunch periods, in the order they occur.<\/div>\n    <div class=\"grid-form\">\n      <div><label>Label<\/label><input id=\"p_label\" placeholder=\"e.g. 9 or Break\"><\/div>\n      <div><label>Time<\/label><input id=\"p_time\" placeholder=\"e.g. 14:40–15:20\"><\/div>\n      <div><label>Type<\/label>\n        <select id=\"p_type\"><option value=\"lesson\">Lesson<\/option><option value=\"break\">Break / non-teaching<\/option><\/select>\n      <\/div>\n    <\/div>\n    <button class=\"btn ghost small\" id=\"addPeriodBtn\">Add period<\/button>\n    <table style=\"margin-top:16px;\">\n      <thead><tr><th>#<\/th><th>Label<\/th><th>Time<\/th><th>Type<\/th><th><\/th><\/tr><\/thead>\n      <tbody>\n      ${state.config.periods.map((p,idx)=>`\n        <tr>\n          <td>${idx+1}<\/td><td>${esc(p.label)}<\/td><td>${esc(p.time)}<\/td>\n          <td style=\"text-transform:capitalize;\">${p.type}<\/td>\n          <td class=\"row-actions\">\n            ${idx>0?`<button class=\"icon-btn move-up\" data-idx=\"${idx}\">↑<\/button>`:\"\"}\n            ${idx<state.config.periods.length-1?`<button class=\"icon-btn move-down\" data-idx=\"${idx}\">↓<\/button>`:\"\"}\n            <button class=\"icon-btn del\" data-idx=\"${idx}\">Remove<\/button>\n          <\/td>\n        <\/tr>`).join(\"\")}\n      <\/tbody>\n    <\/table>\n  `;\n  main.appendChild(pPanel);\n  pPanel.querySelector(\"#addPeriodBtn\").onclick = ()=>{\n    const label = pPanel.querySelector(\"#p_label\").value.trim();\n    const time = pPanel.querySelector(\"#p_time\").value.trim();\n    const type = pPanel.querySelector(\"#p_type\").value;\n    if(!label){ alert(\"Please enter a label for this period.\"); return; }\n    state.config.periods.push({id:uid(\"per\"), label, time, type});\n    saveState(); render();\n  };\n  pPanel.querySelectorAll(\".del\").forEach(b=>{\n    b.onclick = ()=>{ state.config.periods.splice(Number(b.dataset.idx),1); saveState(); render(); };\n  });\n  pPanel.querySelectorAll(\".move-up\").forEach(b=>{\n    b.onclick = ()=>{\n      const i = Number(b.dataset.idx);\n      [state.config.periods[i-1], state.config.periods[i]] = [state.config.periods[i], state.config.periods[i-1]];\n      saveState(); render();\n    };\n  });\n  pPanel.querySelectorAll(\".move-down\").forEach(b=>{\n    b.onclick = ()=>{\n      const i = Number(b.dataset.idx);\n      [state.config.periods[i+1], state.config.periods[i]] = [state.config.periods[i], state.config.periods[i+1]];\n      saveState(); render();\n    };\n  });\n}\n\n/* =========================================================\n   SCHEDULING ALGORITHM\n   ========================================================= */\nfunction generateSchedule(){\n  const days = state.config.days;\n  const periods = lessonPeriods();\n  const slots = [];\n  days.forEach(day=> periods.forEach(p=> slots.push({day, periodId:p.id})));\n\n  // Build requirement list: one item per (class, load-line), each needs N period placements.\n  const requirements = [];\n  state.classes.forEach(c=>{\n    c.load.forEach(l=>{\n      requirements.push({\n        classId:c.id,\n        subjectId:l.subjectId,\n        teacherId:l.teacherId,\n        periodsNeeded:Number(l.periodsPerWeek)||0,\n        homeRoomId:c.homeRoomId,\n        specialRoomId:(state.subjects.find(s=>s.id===l.subjectId)||{}).specialRoomId || null\n      });\n    });\n  });\n  // Largest-load-first tends to schedule more successfully.\n  requirements.sort((a,b)=> b.periodsNeeded - a.periodsNeeded);\n\n  const entries = [];\n  const unscheduled = [];\n\n  // occupancy trackers keyed by \"day|periodId\"\n  const classBusy   = {}; // classId -> Set of slotKey\n  const teacherBusy = {}; // teacherId -> Set of slotKey\n  const roomBusy    = {}; // roomId -> Set of slotKey\n  const slotKey = s => s.day+\"|\"+s.periodId;\n\n  function isFree(map, key, slotK){\n    return !(map[key] && map[key].has(slotK));\n  }\n  function markBusy(map, key, slotK){\n    if(!map[key]) map[key] = new Set();\n    map[key].add(slotK);\n  }\n\n  requirements.forEach((req, reqIdx)=>{\n    // one placement per period a subject meets; avoid same subject twice same day where possible\n    let placed = 0;\n    const usedDaysForThis = new Set();\n\n    // rotate the slot start point per requirement so early requirements don't\n    // all get pushed onto Monday morning first — everyone gets a fair shot at each slot\n    const rotation = (reqIdx * 7) % slots.length;\n    const orderedSlots = slots.slice(rotation).concat(slots.slice(0, rotation));\n\n    for(let attempt=0; attempt<orderedSlots.length && placed<req.periodsNeeded; attempt++){\n      const s = orderedSlots[attempt];\n      const sk = slotKey(s);\n\n      if(!isFree(classBusy, req.classId, sk)) continue;\n      if(req.teacherId && !isFree(teacherBusy, req.teacherId, sk)) continue;\n      if(usedDaysForThis.has(s.day) && orderedSlots.length - attempt > (req.periodsNeeded-placed)) {\n        // prefer spreading across days when there's still room to do so later\n        continue;\n      }\n\n      // room choice: special room if the subject needs one, else the class's home room, else any free classroom\n      let chosenRoom = null;\n      if(req.specialRoomId){\n        if(isFree(roomBusy, req.specialRoomId, sk)) chosenRoom = req.specialRoomId; else continue;\n      } else if(req.homeRoomId){\n        if(isFree(roomBusy, req.homeRoomId, sk)) chosenRoom = req.homeRoomId; else continue;\n      } else {\n        const freeRoom = state.rooms.find(r=> isFree(roomBusy, r.id, sk));\n        if(freeRoom) chosenRoom = freeRoom.id;\n      }\n\n      entries.push({classId:req.classId, subjectId:req.subjectId, teacherId:req.teacherId, roomId:chosenRoom, day:s.day, periodId:s.periodId});\n      markBusy(classBusy, req.classId, sk);\n      if(req.teacherId) markBusy(teacherBusy, req.teacherId, sk);\n      if(chosenRoom) markBusy(roomBusy, chosenRoom, sk);\n      usedDaysForThis.add(s.day);\n      placed++;\n    }\n\n    // second pass: relax the \"spread across days\" preference if still short\n    if(placed < req.periodsNeeded){\n      for(let attempt=0; attempt<orderedSlots.length && placed<req.periodsNeeded; attempt++){\n        const s = orderedSlots[attempt];\n        const sk = slotKey(s);\n        if(!isFree(classBusy, req.classId, sk)) continue;\n        if(req.teacherId && !isFree(teacherBusy, req.teacherId, sk)) continue;\n\n        let chosenRoom = null;\n        if(req.specialRoomId){\n          if(isFree(roomBusy, req.specialRoomId, sk)) chosenRoom = req.specialRoomId; else continue;\n        } else if(req.homeRoomId){\n          if(isFree(roomBusy, req.homeRoomId, sk)) chosenRoom = req.homeRoomId; else continue;\n        } else {\n          const freeRoom = state.rooms.find(r=> isFree(roomBusy, r.id, sk));\n          if(freeRoom) chosenRoom = freeRoom.id;\n        }\n        entries.push({classId:req.classId, subjectId:req.subjectId, teacherId:req.teacherId, roomId:chosenRoom, day:s.day, periodId:s.periodId});\n        markBusy(classBusy, req.classId, sk);\n        if(req.teacherId) markBusy(teacherBusy, req.teacherId, sk);\n        if(chosenRoom) markBusy(roomBusy, chosenRoom, sk);\n        placed++;\n      }\n    }\n\n    if(placed < req.periodsNeeded){\n      unscheduled.push({classId:req.classId, subjectId:req.subjectId, teacherId:req.teacherId, needed:req.periodsNeeded, placed});\n    }\n  });\n\n  state.schedule = {entries, unscheduled, generatedAt: new Date().toISOString()};\n  saveState();\n}\n\n/* =========================================================\n   GENERATE VIEW\n   ========================================================= */\nfunction renderGenerate(main){\n  pageHead(main, \"Generate Timetable\", \"Run the scheduler against your current classes, teachers and rooms.\");\n\n  const totalLoad = state.classes.reduce((s,c)=>s+c.load.reduce((a,l)=>a+Number(l.periodsPerWeek||0),0),0);\n  const readiness = [];\n  if(state.classes.length===0) readiness.push(\"Add at least one class.\");\n  if(totalLoad===0) readiness.push(\"Add subjects to at least one class's teaching load.\");\n  if(state.config.days.length===0) readiness.push(\"Select at least one teaching day.\");\n  if(lessonPeriods().length===0) readiness.push(\"Add at least one lesson period.\");\n\n  const panel = document.createElement(\"div\");\n  panel.className = \"panel\";\n  panel.innerHTML = `\n    <h3>Scheduler<\/h3>\n    <div class=\"hint\">The scheduler places every class's weekly subject load into the timetable grid,\n      avoiding: a teacher double-booked, a room double-booked, and a class with two lessons at once —\n      while trying to spread each subject across different days.<\/div>\n    ${readiness.length ? `<div class=\"banner warn\"><div>Before generating: ${readiness.join(\" \")}<\/div><\/div>` : \"\"}\n    <button class=\"btn brass\" id=\"genBtn\" ${readiness.length?\"disabled\":\"\"}>Generate timetable<\/button>\n    ${state.schedule ? `<button class=\"btn ghost\" id=\"regenBtn\" style=\"margin-left:8px;\">Regenerate<\/button>` : \"\"}\n  `;\n  main.appendChild(panel);\n  const gen = ()=>{ generateSchedule(); activeTab=\"view\"; render(); };\n  const g1 = panel.querySelector(\"#genBtn\"); if(g1) g1.onclick = gen;\n  const g2 = panel.querySelector(\"#regenBtn\"); if(g2) g2.onclick = gen;\n\n  if(state.schedule){\n    const okCount = state.schedule.entries.length;\n    const missCount = state.schedule.unscheduled.reduce((s,u)=>s+(u.needed-u.placed),0);\n    const result = document.createElement(\"div\");\n    result.className = \"panel\";\n    result.innerHTML = `\n      <h3>Last result<\/h3>\n      <div class=\"banner ${missCount? \"warn\":\"ok\"}\">\n        <div>${okCount} periods scheduled successfully.\n        ${missCount ? `${missCount} period(s) could not be placed — see the list below and the Reports tab.` : \"All required periods were placed with no clashes.\"}<\/div>\n      <\/div>\n      ${state.schedule.unscheduled.length ? `\n      <table>\n        <thead><tr><th>Class<\/th><th>Subject<\/th><th>Teacher<\/th><th>Needed<\/th><th>Placed<\/th><th>Short by<\/th><\/tr><\/thead>\n        <tbody>\n          ${state.schedule.unscheduled.map(u=>`\n            <tr>\n              <td>${esc(className(u.classId))}<\/td>\n              <td>${esc(subjectName(u.subjectId))}<\/td>\n              <td>${u.teacherId? esc(teacherName(u.teacherId)) : \"unassigned\"}<\/td>\n              <td>${u.needed}<\/td><td>${u.placed}<\/td><td>${u.needed-u.placed}<\/td>\n            <\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>\n      <div class=\"hint\" style=\"margin-top:10px;\">Tip: shortages usually mean a teacher, room or the class has run out of free slots.\n      Add more periods/days, add another room, or reduce the periods/week for that subject.<\/div>`\n      : \"\"}\n    `;\n    main.appendChild(result);\n  }\n}\n\n/* =========================================================\n   VIEW TIMETABLE\n   ========================================================= */\nlet viewMode = \"class\"; // class | teacher | room\nlet viewSelectedId = null;\n\nfunction renderView(main){\n  pageHead(main, \"View Timetable\", \"Browse the generated schedule by class, teacher, or room.\",\n    `<button class=\"btn ghost small no-print\" onclick=\"window.print()\">Print<\/button>`);\n\n  if(!state.schedule || state.schedule.entries.length===0){\n    const empty = document.createElement(\"div\");\n    empty.className = \"panel\";\n    empty.innerHTML = `<div class=\"empty\">No timetable has been generated yet. Go to \"Generate Timetable\" first.<\/div>`;\n    main.appendChild(empty);\n    return;\n  }\n\n  const controls = document.createElement(\"div\");\n  controls.className = \"panel no-print\";\n  controls.innerHTML = `\n    <div class=\"toolbar\" style=\"margin-bottom:0;\">\n      <div class=\"segmented\" id=\"modeSeg\">\n        <button data-m=\"class\" class=\"${viewMode==='class'?'active':''}\">By class<\/button>\n        <button data-m=\"teacher\" class=\"${viewMode==='teacher'?'active':''}\">By teacher<\/button>\n        <button data-m=\"room\" class=\"${viewMode==='room'?'active':''}\">By room<\/button>\n      <\/div>\n      <select class=\"picker\" id=\"entityPicker\"><\/select>\n    <\/div>\n  `;\n  main.appendChild(controls);\n\n  const options = viewMode===\"class\" ? state.classes\n                : viewMode===\"teacher\" ? state.teachers\n                : state.rooms;\n  if(!viewSelectedId || !options.find(o=>o.id===viewSelectedId)){\n    viewSelectedId = options[0] ? options[0].id : null;\n  }\n  const picker = controls.querySelector(\"#entityPicker\");\n  picker.innerHTML = options.map(o=>`<option value=\"${o.id}\" ${o.id===viewSelectedId?\"selected\":\"\"}>${esc(o.name)}<\/option>`).join(\"\")\n                    || `<option disabled>None available<\/option>`;\n  picker.onchange = ()=>{ viewSelectedId = picker.value; render(); };\n  controls.querySelectorAll(\"#modeSeg button\").forEach(b=>{\n    b.onclick = ()=>{ viewMode=b.dataset.m; viewSelectedId=null; render(); };\n  });\n\n  if(!viewSelectedId){\n    const empty = document.createElement(\"div\");\n    empty.className = \"panel\";\n    empty.innerHTML = `<div class=\"empty\">Nothing to show yet — add ${viewMode}s first.<\/div>`;\n    main.appendChild(empty);\n    return;\n  }\n\n  const filterFn = e => viewMode===\"class\" ? e.classId===viewSelectedId\n                       : viewMode===\"teacher\" ? e.teacherId===viewSelectedId\n                       : e.roomId===viewSelectedId;\n\n  const wrap = document.createElement(\"div\");\n  wrap.className = \"panel\";\n  const entityLabel = viewMode===\"class\"? className(viewSelectedId) : viewMode===\"teacher\"? teacherName(viewSelectedId) : roomName(viewSelectedId);\n  wrap.innerHTML = `<h3>${esc(entityLabel)} — weekly timetable<\/h3>`;\n\n  const ttWrap = document.createElement(\"div\");\n  ttWrap.className = \"tt-wrap\";\n  const table = document.createElement(\"table\");\n  table.className = \"tt\";\n  const days = state.config.days;\n\n  let thead = `<thead><tr><th>Period<\/th>${days.map(d=>`<th>${d}<\/th>`).join(\"\")}<\/tr><\/thead>`;\n  let tbody = \"<tbody>\";\n  state.config.periods.forEach(p=>{\n    if(p.type===\"break\"){\n      tbody += `<tr><td class=\"period-label\">${esc(p.label)}<br>${esc(p.time)}<\/td><td class=\"break-cell\" colspan=\"${days.length}\">${esc(p.label)}<\/td><\/tr>`;\n      return;\n    }\n    tbody += `<tr><td class=\"period-label\">${esc(p.label)}<br>${esc(p.time)}<\/td>`;\n    days.forEach(day=>{\n      const entry = state.schedule.entries.find(e=> e.day===day && e.periodId===p.id && filterFn(e));\n      if(entry){\n        const line2 = viewMode===\"class\"\n          ? `${teacherName(entry.teacherId)} · ${roomName(entry.roomId)}`\n          : viewMode===\"teacher\"\n          ? `${className(entry.classId)} · ${roomName(entry.roomId)}`\n          : `${className(entry.classId)} · ${teacherName(entry.teacherId)}`;\n        tbody += `<td><div class=\"cell-slot\"><div class=\"sub\">${esc(subjectCode(entry.subjectId)||subjectName(entry.subjectId))}<\/div><div class=\"meta\">${esc(line2)}<\/div><\/div><\/td>`;\n      }else{\n        tbody += `<td><div class=\"cell-slot empty-slot\">—<\/div><\/td>`;\n      }\n    });\n    tbody += \"<\/tr>\";\n  });\n  tbody += \"<\/tbody>\";\n  table.innerHTML = thead+tbody;\n  ttWrap.appendChild(table);\n  wrap.appendChild(ttWrap);\n  main.appendChild(wrap);\n}\n\n/* =========================================================\n   REPORTS\n   ========================================================= */\nfunction renderReports(main){\n  pageHead(main, \"Reports\", \"Summaries you can print or export for the staffroom noticeboard.\",\n    `<button class=\"btn ghost small no-print\" onclick=\"window.print()\">Print this page<\/button>\n     <button class=\"btn brass small no-print\" id=\"csvBtn\">Export CSV<\/button>`);\n\n  if(!state.schedule || state.schedule.entries.length===0){\n    const empty = document.createElement(\"div\");\n    empty.className = \"panel\";\n    empty.innerHTML = `<div class=\"empty\">No timetable has been generated yet. Go to \"Generate Timetable\" first.<\/div>`;\n    main.appendChild(empty);\n    return;\n  }\n\n  const csvBtn = main.querySelector(\"#csvBtn\");\n  if(csvBtn) csvBtn.onclick = exportCSV;\n\n  // Teacher load summary\n  const loadPanel = document.createElement(\"div\");\n  loadPanel.className = \"panel\";\n  const teacherLoads = state.teachers.map(t=>{\n    const count = state.schedule.entries.filter(e=>e.teacherId===t.id).length;\n    return {t, count};\n  });\n  loadPanel.innerHTML = `\n    <h3>Teacher workload summary<\/h3>\n    <table>\n      <thead><tr><th>Teacher<\/th><th>Scheduled periods / week<\/th><th>Max periods / week<\/th><th>Status<\/th><\/tr><\/thead>\n      <tbody>\n      ${teacherLoads.map(({t,count})=>`\n        <tr>\n          <td>${esc(t.name)}<\/td><td>${count}<\/td><td>${t.maxPeriods}<\/td>\n          <td>${count>t.maxPeriods ? `<span class=\"tag\" style=\"background:var(--brick-bg);border-color:#E6C0BB;color:var(--brick);\">over limit<\/span>` : `<span class=\"tag\" style=\"background:var(--ok-bg);border-color:#BFDAE8;color:#1B4A63;\">within limit<\/span>`}<\/td>\n        <\/tr>`).join(\"\") || `<tr><td colspan=\"4\">No teachers on record.<\/td><\/tr>`}\n      <\/tbody>\n    <\/table>\n  `;\n  main.appendChild(loadPanel);\n\n  // Room utilisation\n  const totalSlots = state.config.days.length * lessonPeriods().length;\n  const roomPanel = document.createElement(\"div\");\n  roomPanel.className = \"panel\";\n  roomPanel.innerHTML = `\n    <h3>Room utilisation<\/h3>\n    <table>\n      <thead><tr><th>Room<\/th><th>Type<\/th><th>Periods used / week<\/th><th>Utilisation<\/th><\/tr><\/thead>\n      <tbody>\n        ${state.rooms.map(r=>{\n          const count = state.schedule.entries.filter(e=>e.roomId===r.id).length;\n          const pct = totalSlots ? Math.round(count/totalSlots*100) : 0;\n          return `<tr><td>${esc(r.name)}<\/td><td style=\"text-transform:capitalize;\">${esc(r.type)}<\/td><td>${count} / ${totalSlots}<\/td><td>${pct}%<\/td><\/tr>`;\n        }).join(\"\") || `<tr><td colspan=\"4\">No rooms on record.<\/td><\/tr>`}\n      <\/tbody>\n    <\/table>\n  `;\n  main.appendChild(roomPanel);\n\n  // Unscheduled / conflicts\n  if(state.schedule.unscheduled.length){\n    const conf = document.createElement(\"div\");\n    conf.className = \"panel\";\n    conf.innerHTML = `\n      <h3>Unplaced periods<\/h3>\n      <div class=\"banner warn\"><div>These periods could not be placed without a clash and need manual attention or a change of constraints.<\/div><\/div>\n      <table>\n        <thead><tr><th>Class<\/th><th>Subject<\/th><th>Teacher<\/th><th>Short by<\/th><\/tr><\/thead>\n        <tbody>\n        ${state.schedule.unscheduled.map(u=>`\n          <tr><td>${esc(className(u.classId))}<\/td><td>${esc(subjectName(u.subjectId))}<\/td>\n          <td>${u.teacherId?esc(teacherName(u.teacherId)):\"unassigned\"}<\/td><td>${u.needed-u.placed}<\/td><\/tr>`).join(\"\")}\n        <\/tbody>\n      <\/table>\n    `;\n    main.appendChild(conf);\n  }\n\n  // Full timetable by class, printable\n  const full = document.createElement(\"div\");\n  full.className = \"panel\";\n  full.innerHTML = `<h3>Full timetable — all classes<\/h3>`;\n  state.classes.forEach(c=>{\n    const block = document.createElement(\"div\");\n    block.style.marginBottom = \"22px\";\n    const days = state.config.days;\n    let rows = \"\";\n    state.config.periods.forEach(p=>{\n      if(p.type===\"break\"){\n        rows += `<tr><td class=\"period-label\">${esc(p.label)}<\/td><td class=\"break-cell\" colspan=\"${days.length}\">${esc(p.label)}<\/td><\/tr>`;\n        return;\n      }\n      rows += `<tr><td class=\"period-label\">${esc(p.label)}<\/td>`;\n      days.forEach(day=>{\n        const entry = state.schedule.entries.find(e=>e.classId===c.id && e.day===day && e.periodId===p.id);\n        rows += entry\n          ? `<td><div class=\"cell-slot\"><div class=\"sub\">${esc(subjectCode(entry.subjectId)||subjectName(entry.subjectId))}<\/div><div class=\"meta\">${esc(teacherName(entry.teacherId))}${entry.roomId?\" · \"+esc(roomName(entry.roomId)):\"\"}<\/div><\/div><\/td>`\n          : `<td><div class=\"cell-slot empty-slot\">—<\/div><\/td>`;\n      });\n      rows += \"<\/tr>\";\n    });\n    block.innerHTML = `\n      <h3 style=\"font-size:14px;margin-bottom:8px;\">${esc(c.name)}<\/h3>\n      <div class=\"tt-wrap\"><table class=\"tt\">\n        <thead><tr><th>Period<\/th>${days.map(d=>`<th>${d}<\/th>`).join(\"\")}<\/tr><\/thead>\n        <tbody>${rows}<\/tbody>\n      <\/table><\/div>\n    `;\n    full.appendChild(block);\n  });\n  main.appendChild(full);\n}\n\nfunction exportCSV(){\n  if(!state.schedule) return;\n  const rows = [[\"Class\",\"Subject\",\"Teacher\",\"Room\",\"Day\",\"Period\",\"Time\"]];\n  const dayOrder = state.config.days;\n  const periodOrder = state.config.periods.map(p=>p.id);\n  state.schedule.entries\n    .slice()\n    .sort((a,b)=>{\n      const d = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);\n      if(d !== 0) return d;\n      return periodOrder.indexOf(a.periodId) - periodOrder.indexOf(b.periodId);\n    })\n    .forEach(e=>{\n      const per = state.config.periods.find(p=>p.id===e.periodId) || {};\n      rows.push([\n        className(e.classId), subjectName(e.subjectId), teacherName(e.teacherId),\n        e.roomId? roomName(e.roomId):\"\", e.day, per.label||\"\", per.time||\"\"\n      ]);\n    });\n  const csv = rows.map(r=> r.map(v=>`\"${String(v).replace(/\"/g,'\"\"')}\"`).join(\",\")).join(\"\\n\");\n  const blob = new Blob([csv], {type:\"text/csv\"});\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(blob);\n  a.download = \"mukumu_timetable.csv\";\n  a.click();\n}\n\n/* =========================================================\n   DATA EXPORT / IMPORT / RESET\n   ========================================================= */\ndocument.getElementById(\"exportDataBtn\").onclick = ()=>{\n  const blob = new Blob([JSON.stringify(state,null,2)], {type:\"application/json\"});\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(blob);\n  a.download = \"mukumu_timetable_data.json\";\n  a.click();\n};\ndocument.getElementById(\"resetDataBtn\").onclick = ()=>{\n  if(!confirm(\"This will erase all teachers, subjects, rooms, classes and the generated timetable. Continue?\")) return;\n  state = structuredClone(DEFAULT_STATE);\n  saveState();\n  activeTab = \"dashboard\";\n  render();\n};\n\n/* =========================================================\n   INIT\n   ========================================================= */\nrender();\n\n})();\n<\/script>\n<\/body>\n<\/html>\n",
