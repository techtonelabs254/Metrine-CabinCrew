tudent.cls) + '<\/span><\/div>' +\n      '<div class=\"receipt-row\"><span>Method<\/span><span>' + esc(payment.method) + '<\/span><\/div>' +\n      '<div class=\"receipt-divider\"><\/div>' +\n      '<div class=\"receipt-total\"><span>Amount paid<\/span><span>' + fmtKES(payment.amount) + '<\/span><\/div>' +\n      balRow + note +\n      '<div class=\"receipt-actions\">' +\n        '<button type=\"button\" class=\"btn btn-secondary\" onclick=\"window.print()\">Print receipt<\/button>' +\n      '<\/div>';\n  }\n\n  /* ---------------- REPORTS ---------------- */\n  var reportTermSelect = document.getElementById('reportTermSelect');\n\n  function populateTermSelect(selectEl, selectedId){\n    selectEl.innerHTML = '';\n    state.terms.slice().sort(function(a,b){ return a.order - b.order; }).forEach(function(t){\n      var opt = document.createElement('option');\n      opt.value = t.id;\n      opt.textContent = termLabel(t) + (t.status === 'current' ? ' (current)' : '');\n      selectEl.appendChild(opt);\n    });\n    selectEl.value = selectedId || getCurrentTerm().id;\n  }\n\n  reportTermSelect.addEventListener('change', function(){ renderReports(); });\n\n  function renderReports(){\n    if(!reportTermSelect.options.length) populateTermSelect(reportTermSelect, getCurrentTerm().id);\n    var termId = parseInt(reportTermSelect.value, 10) || getCurrentTerm().id;\n    var term = getTermById(termId);\n\n    document.getElementById('reportBarsTitle').textContent = 'Fees collected by class — ' + termLabel(term);\n    document.getElementById('reportBalancesTitle').textContent = 'Balance list — ' + termLabel(term);\n\n    var totals = {};\n    var maxVal = 1;\n    CLASSES.forEach(function(c){ totals[c] = 0; });\n    state.payments.filter(function(p){ return p.termId === termId; }).forEach(function(p){\n      var student = state.students.find(function(s){ return s.id === p.studentId; });\n      if(student && totals.hasOwnProperty(student.cls)) totals[student.cls] += p.amount;\n    });\n    CLASSES.forEach(function(c){ if(totals[c] > maxVal) maxVal = totals[c]; });\n\n    var bars = document.getElementById('reportBars');\n    bars.innerHTML = '';\n    CLASSES.forEach(function(c){\n      var pct = Math.round((totals[c] / maxVal) * 100);\n      var row = document.createElement('div');\n      row.className = 'bar-row';\n      row.innerHTML =\n        '<div class=\"bar-label\"><span>' + c + '<\/span><span>' + fmtKES(totals[c]) + '<\/span><\/div>' +\n        '<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:' + pct + '%;\"><\/div><\/div>';\n      bars.appendChild(row);\n    });\n\n    var body = document.getElementById('reportBalancesBody');\n    body.innerHTML = '';\n    state.students.slice().sort(function(a,b){ return balanceOf(b, termId) - balanceOf(a, termId); }).forEach(function(s){\n      var st = statusOf(s, termId);\n      var tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td>' + esc(s.adm) + '<\/td>' +\n        '<td>' + esc(s.name) + '<\/td>' +\n        '<td>' + esc(s.cls) + '<\/td>' +\n        '<td>' + fmtKES(balanceOf(s, termId)) + '<\/td>' +\n        '<td><span class=\"badge ' + st + '\">' + statusLabel(st) + '<\/span><\/td>';\n      body.appendChild(tr);\n    });\n  }\n\n  document.getElementById('exportCsvBtn').addEventListener('click', function(){\n    var termId = parseInt(reportTermSelect.value, 10) || getCurrentTerm().id;\n    var term = getTermById(termId);\n    if(!term) return;\n\n    function csvCell(value){\n      var text = String(value == null ? '' : value);\n      return '\"' + text.replace(/\"/g, '\"\"') + '\"';\n    }\n\n    var lines = ['Admission No,Name,Class,Term Due,Paid,Balance,Status'];\n    state.students.forEach(function(s){\n      var due = dueForStudent(s, termId);\n      var paid = paidByStudent(s.id, termId);\n      lines.push([\n        s.adm, s.name, s.cls, due, paid, balanceOf(s, termId), statusLabel(statusOf(s, termId))\n      ].map(csvCell).join(','));\n    });\n    var blob = new Blob(['\\uFEFF' + lines.join('\\n')], { type: 'text/csv;charset=utf-8' });\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement('a');\n    a.href = url;\n    a.download = 'brookside-fee-balances-' + term.label.replace(/\\s+/g,'') + '-' + term.year + '.csv';\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n    showToast('Balance report exported as CSV');\n  });\n\n  /* ---------------- TERMS (ADMIN ONLY) ---------------- */\n  var termModal = document.getElementById('termModal');\n  var termForm = document.getElementById('termForm');\n  var termEditId = document.getElementById('termEditId');\n\n  function renderTerms(){\n    var body = document.getElementById('termsBody');\n    body.innerHTML = '';\n    state.terms.slice().sort(function(a,b){ return a.order - b.order; }).forEach(function(t){\n      var tr = document.createElement('tr');\n      var actions = '<button type=\"button\" class=\"link-action\" data-edit-term=\"' + t.id + '\">Edit<\/button>';\n      if(t.status !== 'current'){\n        actions += '<button type=\"button\" class=\"link-action\" data-activate-term=\"' + t.id + '\">Set as current<\/button>';\n      }\n      tr.innerHTML =\n        '<td>' + esc(t.label) + '<\/td>' +\n        '<td>' + esc(t.year) + '<\/td>' +\n        '<td><span class=\"role-pill ' + t.status + '\">' + (t.status.charAt(0).toUpperCase() + t.status.slice(1)) + '<\/span><\/td>' +\n        '<td>' + actions + '<\/td>';\n      body.appendChild(tr);\n    });\n    body.querySelectorAll('[data-edit-term]').forEach(function(btn){\n      btn.addEventListener('click', function(){\n        var t = getTermById(parseInt(btn.getAttribute('data-edit-term'), 10));\n        if(!t) return;\n        document.getElementById('termModalTitle').textContent = 'Edit term';\n        document.getElementById('termModalSub').textContent = 'Update this term\\'s label or year.';\n        termEditId.value = t.id;\n        document.getElementById('termLabel').value = t.label;\n        document.getElementById('termYear').value = t.year;\n        termModal.classList.add('show');\n      });\n    });\n    body.querySelectorAll('[data-activate-term]').forEach(function(btn){\n      btn.addEventListener('click', function(){\n        if(!requireAdmin()) return;\n        var id = parseInt(btn.getAttribute('data-activate-term'), 10);\n        var t = getTermById(id);\n        if(!t) return;\n        if(!confirm('Set ' + termLabel(t) + ' as the current term? Every student\\'s leftover balance from ' + termLabel(getCurrentTerm()) + ' will carry forward into it.')) return;\n        if(!activateTerm(id)){\n          showToast('Could not activate the selected term.');\n          return;\n        }\n        populateTermSelect(feeStructureTermSelect, id);\n        populateTermSelect(reportTermSelect, id);\n        showToast(termLabel(t) + ' is now the current term.');\n        renderTerms();\n        applyRoleUI();\n        if(typeof updateFeeStructureStatus === 'function') updateFeeStructureStatus();\n        renderAll();\n      });\n    });\n  }\n\n  document.getElementById('openAddTerm').addEventListener('click', function(){\n    if(!requireAdmin()) return;\n    document.getElementById('termModalTitle').textContent = 'New term';\n    document.getElementById('termModalSub').textContent = 'Add a term to the academic calendar.';\n    termForm.reset();\n    termEditId.value = '';\n    document.getElementById('termYear').value = new Date().getFullYear();\n    termModal.classList.add('show');\n  });\n  document.getElementById('cancelTermModal').addEventListener('click', function(){\n    termModal.classList.remove('show');\n  });\n  termModal.addEventListener('click', function(e){\n    if(e.target === termModal) termModal.classList.remove('show');\n  });\n\n  termForm.addEventListener('submit', function(e){\n    e.preventDefault();\n    if(!requireAdmin()) return;\n    var label = document.getElementById('termLabel').value.trim();\n    var year = parseInt(document.getElementById('termYear').value, 10);\n    if(!label || !year) return;\n\n    var editingId = termEditId.value ? parseInt(termEditId.value, 10) : null;\n    var dup = state.terms.some(function(x){\n      return x.id !== editingId && x.label.toLowerCase() === label.toLowerCase() && x.year === year;\n    });\n    if(dup){ showToast('That term already exists.'); return; }\n\n    if(termEditId.value){\n      var t = getTermById(parseInt(termEditId.value, 10));\n      if(t){ t.label = label; t.year = year; }\n      showToast('Term updated.');\n    } else {\n      var newId = state.terms.length ? Math.max.apply(null, state.terms.map(function(t){ return t.id; })) + 1 : 1;\n      var newOrder = state.terms.length ? Math.max.apply(null, state.terms.map(function(t){ return t.order; })) + 1 : 1;\n      state.terms.push({ id: newId, label: label, year: year, order: newOrder, status: 'upcoming' });\n      CLASSES.forEach(function(c){\n        var zero = {}; FEE_COMPONENTS.forEach(function(k){ zero[k] = 0; });\n        state.feeStructures.push({ termId: newId, cls: c, amount: 0, components: zero });\n      });\n      showToast('Term added: ' + label + ' ' + year);\n    }\n    save();\n    termModal.classList.remove('show');\n    renderTerms();\n    applyRoleUI();\n    renderAll();\n  });\n\n  /* ---------------- FEE STRUCTURE (ADMIN EDITS, BURSAR VIEWS) ---------------- */\n  var feeStructureTermSelect = document.getElementById('feeStructureTermSelect');\n  var feeCopyFromSelect = document.getElementById('feeCopyFromSelect');\n  var feeStructureEditMode = false;\n\n  function isAdminUser(){ return !!currentUser && currentUser.role === 'admin'; }\n  function isFeeStructureActive(termId){\n    var term = getTermById(termId);\n    return !!(term && term.status === 'current');\n  }\n  function selectedFeeTermId(){\n    return parseInt(feeStructureTermSelect.value, 10) || getCurrentTerm().id;\n  }\n\n  function updateFeeStructureStatus(){\n    var status = document.getElementById('feeStructureStatus');\n    var publishBtn = document.getElementById('publishFeeStructureBtn');\n    if(!status || !publishBtn) return;\n    var active = isFeeStructureActive(selectedFeeTermId());\n    status.textContent = active\n      ? 'Active — these amounts bill the current term'\n      : 'Not active — changes here do not affect balances until published';\n    publishBtn.textContent = active ? 'Active fee structure' : 'Publish / Activate';\n    publishBtn.disabled = active;\n  }\n\n  function setFeeStructureEditMode(enabled){\n    feeStructureEditMode = !!enabled && isAdminUser();\n    document.querySelectorAll('#feeStructureBody [data-fee-component]').forEach(function(input){\n      input.disabled = !feeStructureEditMode;\n    });\n    var panel = document.getElementById('feeStructureForm').closest('.panel');\n    if(panel) panel.classList.toggle('fee-editing', feeStructureEditMode);\n    var hint = document.getElementById('feeStructureEditHint');\n    var editBtn = document.getElementById('editFeeStructureBtn');\n    if(hint) hint.textContent = feeStructureEditMode ? 'Editing: change any amount, then click Save / Update.' : 'Click Edit fee structure to change amounts.';\n    if(editBtn){ editBtn.textContent = feeStructureEditMode ? 'Editing fee structure' : 'Edit fee structure'; editBtn.disabled = feeStructureEditMode; }\n    document.getElementById('cancelFeeStructureEditBtn').disabled = !feeStructureEditMode;\n    document.getElementById('saveFeeStructureBtn').disabled = !feeStructureEditMode;\n    document.getElementById('feeStructureFormSaveBtn').disabled = !feeStructureEditMode;\n  }\n\n  function renderFeeStructureView(){\n    if(!feeStructureTermSelect.options.length) populateTermSelect(feeStructureTermSelect, getCurrentTerm().id);\n    renderFeeStructureBody();\n  }\n\n  function renderFeeStructureBody(){\n    var termId = selectedFeeTermId();\n    var body = document.getElementById('feeStructureBody');\n    var foot = document.getElementById('feeStructureFoot');\n    body.innerHTML = '';\n    CLASSES.forEach(function(c){\n      var tr = document.createElement('tr');\n      var cells = '<td><strong>' + esc(c) + '<\/strong><\/td>';\n      FEE_COMPONENTS.forEach(function(k){\n        cells += '<td><input type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" class=\"table-input\" data-fee-class=\"' + esc(c) + '\" data-fee-component=\"' + esc(k) + '\" aria-label=\"' + esc(c + ' ' + k) + '\" value=\"' + feeComponentValue(c, termId, k) + '\" disabled><\/td>';\n      });\n      cells += '<td><strong data-fee-total=\"' + esc(c) + '\"><\/strong><\/td>';\n      tr.innerHTML = cells;\n      body.appendChild(tr);\n    });\n    foot.innerHTML = '<tr><th>All classes combined<\/th>' + FEE_COMPONENTS.map(function(k){ return '<th data-fee-foot=\"' + k + '\"><\/th>'; }).join('') + '<th data-fee-foot-total><\/th><\/tr>';\n    recalcFeeTotals();\n\n    // \"Copy from\" options: every other term\n    var prevCopy = feeCopyFromSelect.value;\n    feeCopyFromSelect.innerHTML = '<option value=\"\">Copy from…<\/option>';\n    state.terms.slice().sort(function(a,b){ return a.order - b.order; }).forEach(function(t){\n      if(t.id === termId) return;\n      var opt = document.createElement('option');\n      opt.value = t.id; opt.textContent = termLabel(t);\n      feeCopyFromSelect.appendChild(opt);\n    });\n    if(prevCopy && feeCopyFromSelect.querySelector('option[value=\"' + prevCopy + '\"]')) feeCopyFromSelect.value = prevCopy;\n\n    feeStructureTermSelect.dataset.prev = feeStructureTermSelect.value;\n    updateFeeStructureStatus();\n    setFeeStructureEditMode(feeStructureEditMode);\n  }\n\n  function inputAmount(input){\n    var n = Number(input.value);\n    return Number.isFinite(n) && n > 0 ? n : 0;\n  }\n  function recalcFeeTotals(){\n    var colTotals = {}; FEE_COMPONENTS.forEach(function(k){ colTotals[k] = 0; });\n    var grand = 0;\n    CLASSES.forEach(function(c){\n      var rowTotal = 0;\n      FEE_COMPONENTS.forEach(function(k){\n        var input = document.querySelector('#feeStructureBody [data-fee-class=\"' + c + '\"][data-fee-component=\"' + k + '\"]');\n        var v = input ? inputAmount(input) : 0;\n        rowTotal += v; colTotals[k] += v;\n      });\n      grand += rowTotal;\n      var cell = document.querySelector('#feeStructureBody [data-fee-total=\"' + c + '\"]');\n      if(cell) cell.textContent = fmtKES(rowTotal);\n    });\n    FEE_COMPONENTS.forEach(function(k){\n      var th = document.querySelector('#feeStructureFoot [data-fee-foot=\"' + k + '\"]');\n      if(th) th.textContent = fmtKES(colTotals[k]);\n    });\n    var gt = document.querySelector('#feeStructureFoot [data-fee-foot-total]');\n    if(gt) gt.textContent = fmtKES(grand);\n    return grand;\n  }\n\n  // Totals update live while the admin types.\n  document.getElementById('feeStructureBody').addEventListener('input', function(e){\n    if(e.target && e.target.hasAttribute('data-fee-component')) recalcFeeTotals();\n  });\n  document.getElementById('feeStructureBody').addEventListener('change', function(e){\n    var t = e.target;\n    if(t && t.hasAttribute('data-fee-component')){\n      t.value = inputAmount(t);\n      recalcFeeTotals();\n    }\n  });\n\n  feeStructureTermSelect.addEventListener('change', function(){\n    if(feeStructureEditMode && !confirm('Discard your unsaved fee edits?')){\n      feeStructureTermSelect.value = feeStructureTermSelect.dataset.prev;\n      return;\n    }\n    feeStructureEditMode = false;\n    renderFeeStructureBody();\n  });\n\n  function renderLiveFeeStructure(){\n    var term = getCurrentTerm();\n    var head = document.getElementById('liveFeeStructureHead');\n    var body = document.getElementById('liveFeeStructureBody');\n    var foot = document.getElementById('liveFeeStructureFoot');\n    var meta = document.getElementById('liveFeeStructureMeta');\n    if(!head || !body || !foot || !term) return;\n    head.innerHTML = '<tr><th>Class<\/th>' + FEE_COMPONENTS.map(function(k){ return '<th>' + k + '<\/th>'; }).join('') + '<th>Total Fees<\/th><\/tr>';\n    body.innerHTML = '';\n    var grand = {}; FEE_COMPONENTS.forEach(function(k){ grand[k]=0; });\n    CLASSES.forEach(function(c){\n      var tr = document.createElement('tr');\n      var total = 0;\n      var html = '<td><strong>' + c + '<\/strong><\/td>';\n      FEE_COMPONENTS.forEach(function(k){ var v=feeComponentValue(c,term.id,k); grand[k]+=v; total+=v; html += '<td>' + fmtKES(v) + '<\/td>'; });\n      html += '<td><strong>' + fmtKES(total) + '<\/strong><\/td>';\n      tr.innerHTML = html; body.appendChild(tr);\n    });\n    var grandTotal=FEE_COMPONENTS.reduce(function(s,k){return s+grand[k];},0);\n    foot.innerHTML='<tr><th>All classes combined<\/th>'+FEE_COMPONENTS.map(function(k){return '<th>'+fmtKES(grand[k])+'<\/th>';}).join('')+'<th>'+fmtKES(grandTotal)+'<\/th><\/tr>';\n    meta.textContent='Live for ' + termLabel(term);\n  }\n\n  // Writes the amounts currently typed into the table to the chosen term. No re-render here.\n  function commitFeeStructure(termId){\n    if(!requireAdmin()) return false;\n    if(!getTermById(termId)) return false;\n    var inputs = document.querySelectorAll('#feeStructureBody [data-fee-component]');\n    for(var i = 0; i < inputs.length; i++){\n      var raw = inputs[i].value.trim();\n      if(raw !== '' && (!Number.isFinite(Number(raw)) || Number(raw) < 0)){\n        showToast('Fee amounts must be zero or more.');\n        inputs[i].focus();\n        return false;\n      }\n    }\n    CLASSES.forEach(function(cls){\n      var existing = getFeeStructure(cls, termId);\n      if(!existing){\n        existing = { termId: termId, cls: cls, amount: 0, components: {} };\n        state.feeStructures.push(existing);\n      }\n      if(!existing.components) existing.components = {};\n      FEE_COMPONENTS.forEach(function(k){\n        var input = document.querySelector('#feeStructureBody [data-fee-class=\"' + cls + '\"][data-fee-component=\"' + k + '\"]');\n        existing.components[k] = input ? inputAmount(input) : (Number(existing.components[k]) || 0);\n      });\n      existing.amount = FEE_COMPONENTS.reduce(function(sum,k){ return sum + existing.components[k]; }, 0);\n    });\n    save();\n    return true;\n  }\n\n  function saveFeeStructureAction(){\n    if(!requireAdmin()) return;\n    if(!feeStructureEditMode){\n      showToast('Click Edit fee structure first.');\n      return;\n    }\n    var termId = selectedFeeTermId();\n    if(!commitFeeStructure(termId)) return;\n    feeStructureEditMode = false;\n    renderAll();\n    showToast('Fee structure saved for ' + termLabel(getTermById(termId)) + (isFeeStructureActive(termId) ? ' — balances updated.' : '.'));\n  }\n\n  document.getElementById('editFeeStructureBtn').addEventListener('click', function(){\n    if(!requireAdmin()) return;\n    setFeeStructureEditMode(true);\n    showToast('Fee structure is ready for editing.');\n  });\n\n  document.getElementById('cancelFeeStructureEditBtn').addEventListener('click', function(){\n    feeStructureEditMode = false;\n    renderFeeStructureBody();\n    showToast('Fee structure edits cancelled.');\n  });\n\n  document.getElementById('saveFeeStructureBtn').addEventListener('click', saveFeeStructureAction);\n\n  document.getElementById('feeStructureForm').addEventListener('submit', function(e){\n    e.preventDefault();\n    saveFeeStructureAction();\n  });\n\n  document.getElementById('copyFeeStructureBtn').addEventListener('click', function(){\n    if(!requireAdmin()) return;\n    var srcId = parseInt(feeCopyFromSelect.value, 10);\n    if(!srcId){ showToast('Choose a term to copy from.'); return; }\n    var src = getTermById(srcId);\n    if(!src) return;\n    setFeeStructureEditMode(true);\n    document.querySelectorAll('#feeStructureBody [data-fee-component]').forEach(function(input){\n      input.value = feeComponentValue(input.getAttribute('data-fee-class'), srcId, input.getAttribute('data-fee-component'));\n    });\n    recalcFeeTotals();\n    showToast('Amounts copied from ' + termLabel(src) + ' — review, then click Save / Update.');\n  });\n\n  document.getElementById('publishFeeStructureBtn').addEventListener('click', function(){\n    if(!requireAdmin()) return;\n    var termId = selectedFeeTermId();\n    var term = getTermById(termId);\n    if(!term) return;\n    if(isFeeStructureActive(termId)){ showToast('This fee structure is already active.'); return; }\n\n    if(recalcFeeTotals() <= 0){\n      showToast('Set at least one fee amount before publishing.');\n      return;\n    }\n    if(!confirm('Publish the fee structure for ' + termLabel(term) + ' and make it the current term? Leftover balances from ' + termLabel(getCurrentTerm()) + ' will carry forward.')) return;\n\n    if(feeStructureEditMode && !commitFeeStructure(termId)) return;\n    if(!activateTerm(termId)){\n      showToast('Could not activate the selected term.');\n      return;\n    }\n    feeStructureEditMode = false;\n    populateTermSelect(feeStructureTermSelect, termId);\n    populateTermSelect(reportTermSelect, termId);\n    renderTerms();\n    applyRoleUI();\n    renderAll();\n    showToast('Fee structure published and active for ' + termLabel(term) + '.');\n  });\n\n  /* ---------------- USERS (ADMIN ONLY) ---------------- */\n  function renderUsers(){\n    var body = document.getElementById('usersBody');\n    body.innerHTML = '';\n    state.users.forEach(function(u){\n      var isSelf = currentUser && u.id === currentUser.id;\n      var tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td>' + esc(u.name) + (isSelf ? ' <span style=\"color:var(--ink-500); font-size:12px;\">(you)<\/span>' : '') + '<\/td>' +\n        '<td>' + esc(u.username) + '<\/td>' +\n        '<td><span class=\"role-pill\">' + (u.role === 'admin' ? 'Admin' : 'Bursar') + '<\/span><\/td>' +\n        '<td>' +\n          '<button type=\"button\" class=\"link-action\" data-reset-password=\"' + esc(u.id) + '\">Reset password<\/button>' +\n          (isSelf ? '' : '<button type=\"button\" class=\"link-danger\" data-remove-user=\"' + esc(u.id) + '\">Remove<\/button>') +\n        '<\/td>';\n      body.appendChild(tr);\n    });\n    body.querySelectorAll('[data-reset-password]').forEach(function(btn){\n      btn.addEventListener('click', function(){\n        if(!requireAdmin()) return;\n        var id = btn.getAttribute('data-reset-password');\n        var user = state.users.find(function(u){ return u.id === id; });\n        if(!user) return;\n        document.getElementById('resetPasswordUserId').value = user.id;\n        document.getElementById('resetPasswordSub').textContent = 'Set a new password for ' + user.name + ' (' + user.username + ').';\n        document.getElementById('resetPasswordNew').value = '';\n        resetPasswordModal.classList.add('show');\n      });\n    });\n    body.querySelectorAll('[data-remove-user]').forEach(function(btn){\n      btn.addEventListener('click', async function(){\n        if(!requireAdmin()) return;\n        var id = btn.getAttribute('data-remove-user');\n        var user = state.users.find(function(u){ return u.id === id; });\n        if(!user) return;\n        var remainingAdmins = state.users.filter(function(u){ return u.role === 'admin' && u.id !== id; }).length;\n        if(user.role === 'admin' && remainingAdmins === 0){\n          showToast(\"Can't remove the only admin account.\");\n          return;\n        }\n        if(!confirm('Remove the login for ' + user.name + '?')) return;\n        var r = await sb.rpc('admin_delete_user', { target: id });\n        if(r.error){ showToast('Could not remove user: ' + r.error.message); return; }\n        state.users = state.users.filter(function(u){ return u.id !== id; });\n        showToast('User removed: ' + user.name);\n        renderUsers();\n      });\n    });\n  }\n\n  var addUserModal = document.getElementById('addUserModal');\n  var addUserError = document.getElementById('addUserError');\n  document.getElementById('openAddUser').addEventListener('click', function(){\n    if(!requireAdmin()) return;\n    addUserError.style.display = 'none';\n    addUserModal.classList.add('show');\n  });\n  document.getElementById('cancelAddUser').addEventListener('click', function(){\n    addUserModal.classList.remove('show');\n  });\n  addUserModal.addEventListener('click', function(e){\n    if(e.target === addUserModal) addUserModal.classList.remove('show');\n  });\n\n  function showAddUserError(msg){ addUserError.textContent = msg; addUserError.style.display = 'block'; }\n\n  document.getElementById('addUserForm').addEventListener('submit', async function(e){\n    e.preventDefault();\n    if(!requireAdmin()) return;\n    var form = this;\n    var name = document.getElementById('newUserName').value.trim();\n    var username = document.getElementById('newUserUsername').value.trim().toLowerCase();\n    var role = document.getElementById('newUserRole').value;\n    var password = document.getElementById('newUserPassword').value.trim();\n    if(!name || !username || !password) return;\n\n    if(!/^[a-z0-9._-]{3,30}$/.test(username)){ showAddUserError('Username: 3–30 letters, numbers, dots, dashes or underscores.'); return; }\n    if(password.length < 6){ showAddUserError('Password must be at least 6 characters.'); return; }\n    if(state.users.some(function(u){ return u.username.toLowerCase() === username; })){ showAddUserError('That username is already in use.'); return; }\n    addUserError.style.display = 'none';\n\n    var btn = form.querySelector('button[type=\"submit\"]');\n    if(btn) btn.disabled = true;\n    try{\n      // A throw-away client so the admin stays signed in while the new account is created.\n      var tmp = sb;\n      var su = await tmp.auth.signUp({ email: usernameToEmail(username), password: password });\n      if(su.error || !su.data || !su.data.user){\n        showAddUserError('Could not create the login: ' + (su.error ? su.error.message : 'unknown error'));\n        return;\n      }\n      var newId = su.data.user.id;\n      var ins = await sb.from('profiles').insert({ id:newId, username:username, name:name, role:role });\n      if(ins.error){\n        await sb.rpc('admin_delete_user', { target: newId });\n        showAddUserError('Could not save the user: ' + ins.error.message);\n        return;\n      }\n      state.users.push({ id:newId, name:name, username:username, role:role });\n      form.reset();\n      addUserModal.classList.remove('show');\n      showToast('User added: ' + name);\n      renderUsers();\n    }catch(err){\n      showAddUserError('Could not connect. Try again.');\n    }finally{\n      if(btn) btn.disabled = false;\n    }\n  });\n\n  var resetPasswordModal = document.getElementById('resetPasswordModal');\n  document.getElementById('cancelResetPassword').addEventListener('click', function(){\n    resetPasswordModal.classList.remove('show');\n  });\n  resetPasswordModal.addEventListener('click', function(e){\n    if(e.target === resetPasswordModal) resetPasswordModal.classList.remove('show');\n  });\n\n  document.getElementById('resetPasswordForm').addEventListener('submit', async function(e){\n    e.preventDefault();\n    if(!requireAdmin()) return;\n    var id = document.getElementById('resetPasswordUserId').value;\n    var newPassword = document.getElementById('resetPasswordNew').value.trim();\n    var user = state.users.find(function(u){ return u.id === id; });\n    if(!user || !newPassword) return;\n    if(newPassword.length < 6){ showToast('Password must be at least 6 characters.'); return; }\n\n    var r = await sb.rpc('admin_set_password', { target: id, new_password: newPassword });\n    if(r.error){ showToast('Could not update password: ' + r.error.message); return; }\n    resetPasswordModal.classList.remove('show');\n    showToast(\"Password updated for \" + user.name + \".\");\n  });\n\n  /* ---------------- QUICK SEARCH (TOP BAR) ---------------- */\n  var quickSearch = document.getElementById('quickSearch');\n  var searchResults = document.getElementById('searchResults');\n\n  quickSearch.addEventListener('input', function(){\n    var q = quickSearch.value.trim().toLowerCase();\n    if(!q){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }\n    var matches = state.students.filter(function(s){\n      return s.name.toLowerCase().indexOf(q) > -1 || s.adm.toLowerCase().indexOf(q) > -1;\n    }).slice(0,8);\n\n    searchResults.innerHTML = '';\n    if(matches.length === 0){\n      var empty = document.createElement('div');\n      empty.className = 'search-empty';\n      empty.textContent = 'No student matches \"' + quickSearch.value + '\".';\n      searchResults.appendChild(empty);\n    } else {\n      matches.forEach(function(s){\n        var bal = balanceOf(s);\n        var st = statusOf(s);\n        var div = document.createElement('div');\n        div.className = 'search-result-item';\n        div.setAttribute('role', 'button');\n        div.tabIndex = 0;\n\n        var row1 = document.createElement('div');\n        row1.className = 'row1';\n        var nameEl = document.createElement('span');\n        nameEl.textContent = s.name;\n        var balanceEl = document.createElement('span');\n        balanceEl.textContent = fmtKES(bal);\n        row1.appendChild(nameEl);\n        row1.appendChild(balanceEl);\n\n        var row2 = document.createElement('div');\n        row2.className = 'row2';\n        var metaEl = document.createElement('span');\n        metaEl.textContent = s.adm + ' · ' + s.cls;\n        var badge = document.createElement('span');\n        badge.className = 'badge ' + st;\n        badge.textContent = statusLabel(st);\n        row2.appendChild(metaEl);\n        row2.appendChild(badge);\n\n        div.appendChild(row1);\n        div.appendChild(row2);\n        div.addEventListener('click', function(){\n          searchResults.classList.remove('show');\n          quickSearch.value = '';\n          document.querySelector('.nav-item[data-view=\"students\"]').click();\n          document.getElementById('studentFilterText').value = s.adm;\n          renderStudents();\n        });\n        div.addEventListener('keydown', function(event){\n          if(event.key === 'Enter' || event.key === ' '){\n            event.preventDefault();\n            div.click();\n          }\n        });\n        searchResults.appendChild(div);\n      });\n    }\n    searchResults.classList.add('show');\n  });\n\n  document.addEventListener('click', function(e){\n    if(!e.target.closest('.search-box')){\n      searchResults.classList.remove('show');\n    }\n  });\n\n  ['studentFilterText','studentFilterClass','studentFilterStatus'].forEach(function(id){\n    document.getElementById(id).addEventListener('input', renderStudents);\n    document.getElementById(id).addEventListener('change', renderStudents);\n  });\n\n  // Pick up other staff members' changes when the app comes back to the foreground.\n  document.addEventListener('visibilitychange', function(){\n    if(document.visibilityState !== 'visible' || !currentUser) return;\n    if(syncing || syncPending || feeStructureEditMode) return;\n    if(Date.now() - lastLoadedAt < 30000) return;\n    loadAll().then(function(){\n      var still = state.users.find(function(u){ return u.id === currentUser.id; });\n      if(state.users.length && !still && currentUser.role === 'admin') return;\n      renderAll();\n    }).catch(function(){});\n  });\n\n  /* ---------------- RENDER ALL ---------------- */\n  function renderAll(){\n    populateTermSelect(reportTermSelect, reportTermSelect.value || getCurrentTerm().id);\n    populateTermSelect(feeStructureTermSelect, feeStructureTermSelect.value || getCurrentTerm().id);\n    renderOverview();\n    renderStudents();\n    renderPaymentStudentOptions();\n    renderReports();\n    renderFeeStructureView();\n    renderLiveFeeStructure();\n  }\n\n})();\n<\/script>\n<\/body>\n<\/html>\n"};
</script>
<script>

];
var KEY="cbc_mis_v1";
var S={school:"My School",levels:{pp:true,primary:true,junior:true,senior:true},installed:["core"],learners:[],staff:[],terms:[]};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var R={app:"home",menu:0};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mod(id){return MODS.filter(function(m){return m.id===id})[0]}
function has(id){return S.installed.indexOf(id)>-1}
function grades(){var a=[];Object.keys(LEVELS).forEach(function(k){if(S.levels[k])a=a.concat(LEVELS[k].g)});return a}
function levelOf(g){return Object.keys(LEVELS).filter(function(k){return LEVELS[k].g.indexOf(g)>-1})[0]}
function fits(m){return !m.lv||m.lv.some(function(l){return S.levels[l]})}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600)}
function go(a,m){R.app=a;R.menu=m||0;render()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- Install / uninstall with dependency checks ---------- */
function install(id){var m=mod(id);var need=m.dep.filter(function(d){return !has(d)});
 need.forEach(function(d){S.installed.push(d)});S.installed.push(id);save();
 toast(need.length?m.n+" installed (also added "+need.map(function(d){return mod(d).n}).join(", ")+")":m.n+" installed");render()}
function uninstall(id){var by=S.installed.filter(function(x){return mod(x).dep.indexOf(id)>-1});
 if(by.length){toast("Needed by: "+by.map(function(x){return mod(x).n}).join(", "));return}
 S.installed=S.installed.filter(function(x){return x!==id});save();toast(mod(id).n+" uninstalled (data kept)");render()}

/* ---------- Views ---------- */
function render(){
 $("hname").textContent=S.school;document.title=S.school+" — MIS";
 var m=$("main"),b=$("bc");b.textContent="";m.style.maxWidth="";m.style.padding="";
 if(R.app==="home")return home(m);
 if(R.app==="apps"){b.textContent="/ Manage apps";return apps(m)}
 var mo=mod(R.app);b.textContent="/ "+mo.n;b.onclick=function(){go(mo.id,0)};
 if(mo.id==="core")return core(m);
 if(NAT[mo.id])return NAT[mo.id](m);
 if(CFG[mo.id])return gen(m,mo);
 if(SRC[mo.id])return frame(m,mo);
 stub(m,mo)}

function home(m){
 var h="<h2>Your apps</h2><p class='sub'>Only installed modules appear here. Add or remove modules in Manage apps.</p><div class='grid'>";
 S.installed.forEach(function(id){var x=mod(id);h+="<div class='tile' onclick=\"go('"+id+"')\"><div class='ic'>"+x.i+"</div><b>"+esc(x.n)+"</b></div>"});
 h+="<div class='tile' onclick=\"go('apps')\"><div class='ic'>+</div><b>Add apps</b></div></div>";
 var lv=Object.keys(LEVELS).filter(function(k){return S.levels[k]}).map(function(k){return LEVELS[k].n}).join(", ")||"none";
 h+="<h3>Overview</h3><div class='card'>Active levels: <b>"+esc(lv)+"</b> · Learners: <b>"+S.learners.length+"</b> · Staff: <b>"+S.staff.length+"</b> · Installed apps: <b>"+S.installed.length+"</b></div>";
 m.innerHTML=h}

function apps(m){
 var h="<h2>Manage apps</h2><p class='sub'>Install what you use. Dependencies are added automatically; an app can’t be removed while another needs it. Uninstalling keeps your data.</p>";
 ["Platform","Academic","Operations","Finance","Communication"].forEach(function(c){
  h+="<h3>"+c+"</h3><div class='apps'>";
  MODS.filter(function(x){return x.c===c}).forEach(function(x){
   var on=has(x.id),ok=fits(x);
   h+="<div class='card app'><div class='row'><div class='ic' style='margin:0'>"+x.i+"</div><b style='flex:1'>"+esc(x.n)+"</b>"+
   (x.lock?"<span class='tag'>Always on</span>":on?"<button class='d' onclick=\"uninstall('"+x.id+"')\">Uninstall</button>":"<button "+(ok?"":"disabled ")+"onclick=\"install('"+x.id+"')\">Install</button>")+"</div><p>"+esc(x.d)+"</p><div>"+
   x.dep.filter(function(d){return d!=="core"}).map(function(d){return "<span class='tag'>needs "+esc(mod(d).n)+"</span>"}).join("")+
   (x.lv?x.lv.map(function(l){return "<span class='tag"+(S.levels[l]?"":" w")+"'>"+LEVELS[l].n+"</span>"}).join(""):"")+
   (ok?"":"<span class='tag w'>enable a matching level in Core → Settings</span>")+"</div></div>"});
  h+="</div>"});
 m.innerHTML=h}

var CORE_MENU=["Learners","Staff","Calendar","Settings"];
function core(m){
 var h="<div class='lay'><nav class='side'>"+CORE_MENU.map(function(t,i){return "<a class='"+(R.menu===i?"on":"")+"' onclick='go(\"core\","+i+")'>"+t+"</a>"}).join("")+"</nav><div id='pane'></div></div>";
 m.innerHTML=h;[learners,staff,calendar,settings][R.menu]($("pane"))}

var LF="";
function learners(p){
 var gs=grades();
 var h="<h2>Learners</h2><p class='sub'>Grades shown are limited to the levels you’ve enabled.</p>";
 if(!gs.length){p.innerHTML=h+"<div class='card'>No levels enabled. Open Settings and enable at least one.</div>";return}
 h+="<div class='card'><div class='form'><div><label>Full name</label><input id='ln'></div><div><label>Admission no.</label><input id='la'></div><div><label>Grade</label><select id='lg' onchange='pw()'>"+gs.map(function(g){return "<option>"+g+"</option>"}).join("")+"</select></div>"+
 "<div><label>Gender</label><select id='lx'><option>F</option><option>M</option></select></div><div><label>Guardian phone</label><input id='lp' placeholder='07…'></div>"+
 "<div id='pwb' style='display:none'><label>Pathway</label><select id='lw'>"+PATHWAYS.map(function(x){return "<option>"+x+"</option>"}).join("")+"</select></div>"+
 "<button onclick='addL()'>Add learner</button></div></div>";
 h+="<div class='card'><div style='max-width:220px;margin-bottom:8px'><select id='lf' onchange='LF=this.value;learners($(\"pane\"))'><option value=''>All grades</option>"+gs.map(function(g){return "<option"+(LF===g?" selected":"")+">"+g+"</option>"}).join("")+"</select></div>";
 var rows=S.learners.filter(function(l){return !LF||l.g===LF});
 h+=rows.length?"<div class='tw'><table><tr><th>Adm</th><th>Name</th><th>Grade</th><th>Pathway</th><th>Gender</th><th>Guardian</th><th></th></tr>"+rows.map(function(l){return "<tr><td>"+esc(l.a)+"</td><td>"+esc(l.n)+"</td><td>"+esc(l.g)+"</td><td>"+esc(l.w||"—")+"</td><td>"+l.x+"</td><td>"+esc(l.p)+"</td><td><button class='d' onclick=\"delL('"+l.id+"')\">Remove</button></td></tr>"}).join("")+"</table></div>":"<p class='sub'>No learners yet.</p>";
 p.innerHTML=h+"</div>";pw()}
function pw(){var g=$("lg");if(g&&$("pwb"))$("pwb").style.display=levelOf(g.value)==="senior"?"block":"none"}
function addL(){var n=$("ln").value.trim(),a=$("la").value.trim();if(!n||!a){toast("Name and admission no. required");return}
 if(S.learners.some(function(l){return l.a===a})){toast("Admission no. already used");return}
 var g=$("lg").value;S.learners.push({id:uid(),n:n,a:a,g:g,x:$("lx").value,p:$("lp").value.trim(),w:levelOf(g)==="senior"?$("lw").value:""});save();toast("Learner added");learners($("pane"))}
function delL(id){if(!confirm("Remove this learner?"))return;S.learners=S.learners.filter(function(l){return l.id!==id});purge(id);learners($("pane"))}

function staff(p){
 var h="<h2>Staff</h2><p class='sub'>Shared by Timetable, Payroll, Attendance and Planning.</p><div class='card'><div class='form'><div><label>Full name</label><input id='sn'></div><div><label>TSC / staff no.</label><input id='st'></div><div><label>Role</label><select id='sr'><option>Teacher</option><option>Class teacher</option><option>Deputy principal</option><option>Principal</option><option>Bursar</option><option>Support staff</option></select></div><div><label>Phone</label><input id='sp'></div><button onclick='addS()'>Add staff</button></div></div>";
 h+="<div class='card'>"+(S.staff.length?"<div class='tw'><table><tr><th>Name</th><th>No.</th><th>Role</th><th>Phone</th><th></th></tr>"+S.staff.map(function(s){return "<tr><td>"+esc(s.n)+"</td><td>"+esc(s.t)+"</td><td>"+esc(s.r)+"</td><td>"+esc(s.p)+"</td><td><button class='d' onclick=\"delS('"+s.id+"')\">Remove</button></td></tr>"}).join("")+"</table></div>":"<p class='sub'>No staff yet.</p>")+"</div>";

function calendar(p){
 var h="<h2>Academic calendar</h2><p class='sub'>One set of term dates used by every module.</p><div class='card'><div class='form'><div><label>Year</label><input id='cy' type='number' value='"+new Date().getFullYear()+"'></div><div><label>Term</label><select id='ct'><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div><label>Opens</label><input id='cs' type='date'></div><div><label>Closes</label><input id='ce' type='date'></div><button onclick='addT()'>Add term</button></div></div>";

function addT(){var s=$("cs").value,e=$("ce").value;if(!s||!e||e<s){toast("Enter valid dates");return}S.terms.push({id:uid(),y:$("cy").value,t:$("ct").value,s:s,e:e,ord:S.terms.length+1,status:S.terms.length?"closed":"current"});save();calendar($("pane"))}
function delT(id){S.terms=S.terms.filter(function(t){return t.id!==id});save();calendar($("pane"))}

function settings(p){
 var h="<h2>Settings</h2><div class='card'><label>School name</label><input id='sc' value=\""+esc(S.school)+"\" onchange='S.school=this.value||S.school;save();$(\"hname\").textContent=S.school'></div><h3>School levels</h3><div class='card'>";
 Object.keys(LEVELS).forEach(function(k){h+="<div class='chk'><input type='checkbox' id='lv_"+k+"' "+(S.levels[k]?"checked":"")+" onchange=\"tgl('"+k+"',this)\"><div><b>"+LEVELS[k].n+"</b><br><span class='sub'>"+LEVELS[k].g.join(", ")+"</span></div></div>"});
 p.innerHTML=h+"<p class='sub' style='margin:8px 0 0'>Disabling a level hides its grades and any module that only applies to it.</p></div>"}
function tgl(k,el){
 if(!el.checked){var used=S.learners.some(function(l){return levelOf(l.g)===k});if(used){el.checked=true;toast("Remove or move "+LEVELS[k].n+" learners first");return}
  var others=Object.keys(S.levels).filter(function(x){return x!==k&&S.levels[x]});if(!others.length){el.checked=true;toast("Keep at least one level");return}}
 S.levels[k]=el.checked;
 var drop=S.installed.filter(function(id){var m=mod(id);return !fits(m)});
 S.installed=S.installed.filter(function(id){return drop.indexOf(id)<0});save();
 if(drop.length)toast("Hidden: "+drop.map(function(d){return mod(d).n}).join(", "))}

function stub(m,mo){
 var deps=mo.dep.map(function(d){return mod(d).n}).join(", ");
 m.innerHTML="<h2>"+esc(mo.n)+"</h2><p class='sub'>"+esc(mo.d)+"</p><div class='card'><b>Module registered, screens not built yet.</b><p class='sub' style='margin:6px 0 0'>It’s installed and wired to the shared learner, staff and calendar data"+(deps?" (depends on: "+esc(deps)+")":"")+". Its own screens are the next build step.</p></div>"}
function sizeFrame(){var f=$("fr");if(f)f.style.height=(window.innerHeight-document.querySelector("header").offsetHeight)+"px"}
window.addEventListener("resize",sizeFrame);
function seedTT(){try{var K="mukumu_tt_v1",st=JSON.parse(localStorage.getItem(K)||"{}");st.teachers=st.teachers||[];st.classes=st.classes||[];
 S.staff.filter(function(x){return["Teacher","Class teacher","Deputy principal","Principal"].indexOf(x.r)>-1}).forEach(function(x){var id="tea_core_"+x.id;if(!st.teachers.some(function(t){return t.id===id}))st.teachers.push({id:id,name:x.n,code:x.n.split(/\s+/).map(function(w){return w[0]}).join("").toUpperCase().slice(0,3),maxPeriods:27,subjects:[]})});
 grades().forEach(function(g){var n=S.learners.filter(function(l){return l.g===g}).length;var c=st.classes.filter(function(c){return c.name===g})[0];if(c){if(n)c.size=n}else st.classes.push({id:"cls_core_"+g.replace(/\W/g,""),name:g,homeRoomId:null,size:n,load:[]})});
 localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function frame(m,mo){
 var src=SRC[mo.id];
 if(mo.id==="fees"){var gs=grades();
  src=src.replace(/var CLASSES = \[[^\]]*\];/,function(){return "var CLASSES = "+JSON.stringify(gs)+";"})
   .replace(/(\s*<option>Form [1-4]<\/option>){4}/g,function(){return gs.map(function(g){return "<option>"+g+"</option>"}).join("")})
   .replace("Across Form 1 \u2013 Form 4","Across all grades")}
 if(mo.id==="timetable")seedTT();
 m.style.maxWidth="none";m.style.padding="0";
 m.innerHTML="<iframe id='fr' style='width:100%;border:0;display:block'></iframe>";
 sizeFrame();$("fr").srcdoc=src}
/* ---------- Native modules that share the same store ---------- */
var A={},LV=function(s){return s>=75?"EE":s>=50?"ME":s>=30?"AE":"BE"};

 h+="<div class='card'><b>Fees"+(ct?" ("+esc(ct.y+" "+ct.t)+")":"")+":</b> due KES "+due.toLocaleString()+" · collected KES "+pd.toLocaleString()+(due?" ("+Math.round(pd/due*100)+"%)":"")+"</div>";
 var ar={};Object.keys(S.marks||{}).forEach(function(k){var a=k.split("|")[2];(ar[a]=ar[a]||[]).push(S.marks[k])});
 h+="<div class='card'><b>Average score by learning area</b>"+(Object.keys(ar).length?Object.keys(ar).map(function(a){var v=Math.round(ar[a].reduce(function(x,y){return x+y},0)/ar[a].length);return "<div>"+esc(a)+": "+v+" ("+LV(v)+")</div>"}).join(""):"<p class='sub'>No marks yet.</p>")+"</div>";
 h+="<div class='card'><b>Learners needing attention</b>"+(risk.length?"<div class='tw'><table>"+risk.slice(0,25).map(function(x){return "<tr><td>"+esc(x[0].n)+"</td><td>"+esc(x[0].g)+"</td><td>"+esc(x[1].join(" · "))+"</td></tr>"}).join("")+"</table></div>":"<p class='sub'>None flagged.</p>")+"</div>";
 m.innerHTML=h}
function portal(m){
 if(!A.ok){m.innerHTML="<h2>Parent Portal</h2><p class='sub'>Enter the admission number and the guardian phone on record.</p><div class='card'><div class='form'><div><label>Admission no.</label><input id='pa'></div><div><label>Guardian phone</label><input id='pp'></div><button onclick='pLogin()'>View</button></div></div>";return}
 var l=byId(S.learners,A.l);A.g=l.g;A.t=A.t||(curTerm()||{}).id;reports(m);
 var q=m.querySelector(".noprint");if(q)q.style.display="none";
 var nt=colOf("nt").slice().reverse();
 m.innerHTML+="<div class='card'><b>Notices</b>"+(nt.length?nt.map(function(n){return "<p><b>"+esc(n.ti||"")+"</b> "+esc(n.d||"")+"<br>"+esc(n.bd)+"</p>"}).join(""):"<p class='sub'>No notices.</p>")+"</div><button class='g noprint' onclick='A.ok=0;render()'>Sign out</button>"}
function pLogin(){var a=$("pa").value.trim(),p=$("pp").value.replace(/\D/g,""),l=S.learners.filter(function(x){return x.a===a&&p&&String(x.p||"").replace(/\D/g,"")===p})[0];if(!l){toast("No match");return}A.ok=1;A.l=l.id;render()}
NAT.analytics=analytics;NAT.portal=portal;

render();
