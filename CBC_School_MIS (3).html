\n    <div class=\"content\">\n\n      <\!-- OVERVIEW -->\n      <section class=\"view active\" id=\"view-overview\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Overview<\/h1>\n            <p id=\"overviewSub\">A live snapshot of fee collection.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"stat-grid\">\n          <div class=\"stat-card blue\">\n            <div class=\"label\">Students on record<\/div>\n            <div class=\"value\" id=\"statTotalStudents\">0<\/div>\n            <div class=\"sub\">Across Form 1 – Form 4<\/div>\n          <\/div>\n          <div class=\"stat-card green\">\n            <div class=\"label\">Fees collected this term<\/div>\n            <div class=\"value\" id=\"statCollected\">KES 0<\/div>\n            <div class=\"sub\" id=\"statCollectedSub\">0 payments recorded<\/div>\n          <\/div>\n          <div class=\"stat-card amber\">\n            <div class=\"label\">Outstanding balance<\/div>\n            <div class=\"value\" id=\"statOutstanding\">KES 0<\/div>\n            <div class=\"sub\" id=\"statOutstandingSub\">0 students with a balance<\/div>\n          <\/div>\n          <div class=\"stat-card\">\n            <div class=\"label\">Fully paid / in credit<\/div>\n            <div class=\"value\" id=\"statPaidCount\">0<\/div>\n            <div class=\"sub\">Students with nothing owing<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"two-col\">\n          <div class=\"panel\">\n            <div class=\"panel-head\"><h3>Recent payments<\/h3><\/div>\n            <div class=\"panel-body\" style=\"padding-top:6px;\">\n              <table>\n                <thead><tr><th>Receipt<\/th><th>Student<\/th><th>Amount<\/th><th>Date<\/th><\/tr><\/thead>\n                <tbody id=\"recentPaymentsBody\"><\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n\n          <div class=\"panel\">\n            <div class=\"panel-head\"><h3>Needs attention<\/h3><\/div>\n            <div class=\"panel-body\" style=\"padding-top:6px;\">\n              <table>\n                <thead><tr><th>Student<\/th><th>Balance<\/th><\/tr><\/thead>\n                <tbody id=\"topDebtorsBody\"><\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/div>\n      <div class=\"panel\" style=\"margin-top:18px;\">\n        <div class=\"panel-head\"><h3>Current Fee Structure<\/h3><span class=\"hint\" id=\"liveFeeStructureMeta\">Live for current term<\/span><\/div>\n        <div class=\"panel-body\" style=\"padding-top:6px; overflow-x:auto;\">\n          <table id=\"liveFeeStructureTable\">\n            <thead id=\"liveFeeStructureHead\"><\/thead>\n            <tbody id=\"liveFeeStructureBody\"><\/tbody>\n            <tfoot id=\"liveFeeStructureFoot\"><\/tfoot>\n          <\/table>\n        <\/div>\n      <\/div>\n      <\/section>\n\n      <\!-- STUDENTS -->\n      <section class=\"view\" id=\"view-students\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Students<\/h1>\n            <p>All students currently registered for fee tracking.<\/p>\n          <\/div>\n          <button class=\"btn btn-primary\" id=\"openAddStudent\">+ Add student<\/button>\n        <\/div>\n\n        <div class=\"toolbar\">\n          <input type=\"text\" id=\"studentFilterText\" placeholder=\"Search by name or admission no.\">\n          <select id=\"studentFilterClass\">\n            <option value=\"\">All classes<\/option>\n            <option>Form 1<\/option>\n            <option>Form 2<\/option>\n            <option>Form 3<\/option>\n            <option>Form 4<\/option>\n          <\/select>\n          <select id=\"studentFilterStatus\">\n            <option value=\"\">All statuses<\/option>\n            <option value=\"paid\">Paid<\/option>\n            <option value=\"partial\">Partial<\/option>\n            <option value=\"unpaid\">Unpaid<\/option>\n            <option value=\"credit\">Credit<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-body\" style=\"padding-top:6px;\">\n            <table>\n              <thead>\n                <tr><th>Admission No.<\/th><th>Name<\/th><th>Class<\/th><th>Term due<\/th><th>Paid<\/th><th>Balance<\/th><th>Status<\/th><th><\/th><\/tr>\n              <\/thead>\n              <tbody id=\"studentsBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <\!-- RECORD PAYMENT -->\n      <section class=\"view\" id=\"view-payment\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Record a payment<\/h1>\n            <p>Log a payment and issue a digital receipt instantly.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"two-col\">\n          <div class=\"panel\">\n            <div class=\"panel-head\"><h3>Payment details<\/h3><\/div>\n            <div class=\"panel-body\">\n              <form id=\"paymentForm\">\n                <div class=\"form-grid\">\n                  <div class=\"field full\">\n                    <label for=\"paymentStudent\">Student<\/label>\n                    <select id=\"paymentStudent\" required><\/select>\n                  <\/div>\n                  <div class=\"field\">\n                    <label for=\"paymentAmount\">Amount (KES)<\/label>\n                    <input type=\"number\" id=\"paymentAmount\" min=\"1\" required>\n                  <\/div>\n                  <div class=\"field\">\n                    <label for=\"paymentMethod\">Method<\/label>\n                    <select id=\"paymentMethod\">\n                      <option>M-Pesa<\/option>\n                      <option>Cash<\/option>\n                      <option>Bank Transfer<\/option>\n                      <option>Cheque<\/option>\n                    <\/select>\n                  <\/div>\n                  <div class=\"field full\" id=\"paymentStudentBalanceNote\" style=\"font-size:13px; color:var(--ink-500);\"><\/div>\n                <\/div>\n                <button type=\"submit\" class=\"btn btn-primary\" style=\"margin-top:8px;\">Record payment &amp; generate receipt<\/button>\n              <\/form>\n            <\/div>\n          <\/div>\n\n          <div class=\"panel\">\n            <div class=\"panel-head\"><h3>Receipt<\/h3><\/div>\n            <div class=\"panel-body\" id=\"receiptPrintArea\">\n              <div id=\"receiptCard\" style=\"display:none;\"><\/div>\n              <div class=\"empty-receipt\" id=\"receiptEmptyState\">Record a payment to generate a printable receipt here.<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <\!-- REPORTS -->\n      <section class=\"view\" id=\"view-reports\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Reports<\/h1>\n            <p>Collections and balances for a chosen term — ready to export.<\/p>\n          <\/div>\n          <button class=\"btn btn-secondary\" id=\"exportCsvBtn\">Export balances (CSV)<\/button>\n        <\/div>\n\n        <div class=\"toolbar\">\n          <label style=\"font-size:13px; color:var(--ink-500); align-self:center;\">Term:<\/label>\n          <select id=\"reportTermSelect\"><\/select>\n        <\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-head\"><h3 id=\"reportBarsTitle\">Fees collected by class<\/h3><\/div>\n          <div class=\"panel-body\" id=\"reportBars\"><\/div>\n        <\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-head\"><h3 id=\"reportBalancesTitle\">Balance list<\/h3><\/div>\n          <div class=\"panel-body\" style=\"padding-top:6px;\">\n            <table>\n              <thead><tr><th>Admission No.<\/th><th>Name<\/th><th>Class<\/th><th>Balance<\/th><th>Status<\/th><\/tr><\/thead>\n              <tbody id=\"reportBalancesBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <\!-- TERMS (ADMIN ONLY) -->\n      <section class=\"view\" id=\"view-terms\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Terms<\/h1>\n            <p>Admin can create, edit, update, and activate academic terms.<\/p>\n          <\/div>\n          <button class=\"btn btn-primary\" id=\"openAddTerm\">+ New term<\/button>\n        <\/div>\n\n        <div class=\"hint\" style=\"margin-bottom:18px;\">Setting a term as current carries every student's leftover balance — arrears or credit — forward into it automatically.<\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-body\" style=\"padding-top:6px;\">\n            <table>\n              <thead><tr><th>Term<\/th><th>Year<\/th><th>Status<\/th><th><\/th><\/tr><\/thead>\n              <tbody id=\"termsBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <\!-- FEE STRUCTURE -->\n      <section class=\"view\" id=\"view-feestructure\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Fee Structure<\/h1>\n            <p>View the complete fee breakdown. Admin can create, modify and update the amounts.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"toolbar\">\n          <label style=\"font-size:13px; color:var(--ink-500); align-self:center;\">Term:<\/label>\n          <select id=\"feeStructureTermSelect\"><\/select>\n          <button type=\"button\" class=\"btn btn-secondary admin-only\" id=\"editFeeStructureBtn\">Edit fee structure<\/button>\n          <select id=\"feeCopyFromSelect\" class=\"admin-only\" title=\"Copy amounts from another term\"><\/select>\n          <button type=\"button\" class=\"btn btn-secondary admin-only\" id=\"copyFeeStructureBtn\">Copy amounts<\/button>\n          <button type=\"button\" class=\"btn btn-primary admin-only\" id=\"saveFeeStructureBtn\">Save / Update<\/button>\n          <button type=\"button\" class=\"btn btn-primary admin-only\" id=\"publishFeeStructureBtn\">Publish / Activate<\/button>\n          <span id=\"feeStructureStatus\" class=\"hint\" style=\"margin:0; align-self:center;\"><\/span>\n        <\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-head\"><h3>Complete fee structure<\/h3><span class=\"hint\">Total = all seven fee items<\/span><\/div>\n          <div class=\"panel-body\" style=\"overflow-x:auto;\">\n            <form id=\"feeStructureForm\">\n              <table>\n                <thead>\n                  <tr><th>Class<\/th><th>Maintenance<\/th><th>Welfare<\/th><th>Tuition<\/th><th>Repair<\/th><th>Activity<\/th><th>Project<\/th><th>Transport<\/th><th>Total Fees<\/th><\/tr>\n                <\/thead>\n                <tbody id=\"feeStructureBody\"><\/tbody>\n                <tfoot id=\"feeStructureFoot\"><\/tfoot>\n              <\/table>\n              <div class=\"hint admin-only\" style=\"margin-top:12px;\">Only Admin can edit these amounts. Click <b>Edit fee structure<\/b>, type the amount for each class and fee item, then <b>Save / Update<\/b>. Saving the current term updates every student's balance straight away.<\/div>\n              <div class=\"hint bursar-only\" style=\"margin-top:12px;\">View only — fee amounts are set by the Admin.<\/div>\n              <div class=\"admin-only\" style=\"display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap;\">\n                <button type=\"submit\" class=\"btn btn-primary\" id=\"feeStructureFormSaveBtn\">Save / Update fee structure<\/button>\n                <button type=\"button\" class=\"btn btn-secondary\" id=\"cancelFeeStructureEditBtn\">Cancel edits<\/button>\n                <span class=\"hint\" id=\"feeStructureEditHint\" style=\"margin:0;\">Click Edit fee structure to change amounts.<\/span>\n              <\/div>\n            <\/form>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <\!-- USERS (ADMIN ONLY) -->\n      <section class=\"view\" id=\"view-users\">\n        <div class=\"view-header\">\n          <div>\n            <h1>Users<\/h1>\n            <p>Manage who can sign in to the bursar's dashboard.<\/p>\n          <\/div>\n          <button class=\"btn btn-primary\" id=\"openAddUser\">+ Add user<\/button>\n        <\/div>\n\n        <div class=\"panel\">\n          <div class=\"panel-body\" style=\"padding-top:6px;\">\n            <table>\n              <thead><tr><th>Name<\/th><th>Username<\/th><th>Role<\/th><th><\/th><\/tr><\/thead>\n              <tbody id=\"usersBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/section>\n\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- ADD/EDIT TERM MODAL -->\n<div class=\"modal-overlay\" id=\"termModal\">\n  <div class=\"modal-box\">\n    <h3 id=\"termModalTitle\">New term<\/h3>\n    <div class=\"sub\" id=\"termModalSub\">Add a term to the academic calendar.<\/div>\n    <form id=\"termForm\">\n      <input type=\"hidden\" id=\"termEditId\" value=\"\">\n      <div class=\"form-grid\">\n        <div class=\"field full\">\n          <label for=\"termLabel\">Term label<\/label>\n          <input type=\"text\" id=\"termLabel\" placeholder=\"e.g. Term 1\" required>\n        <\/div>\n        <div class=\"field full\">\n          <label for=\"termYear\">Year<\/label>\n          <input type=\"number\" id=\"termYear\" min=\"2000\" required>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; gap:10px; margin-top:8px;\">\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:1;\">Save term<\/button>\n        <button type=\"button\" class=\"btn btn-secondary\" id=\"cancelTermModal\">Cancel<\/button>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/div>\n\n<\!-- ADD USER MODAL -->\n<div class=\"modal-overlay\" id=\"addUserModal\">\n  <div class=\"modal-box\">\n    <h3>Add a new user<\/h3>\n    <div class=\"sub\">Create a login for the bursar's office or an administrator.<\/div>\n    <form id=\"addUserForm\">\n      <div class=\"form-grid\">\n        <div class=\"field full\">\n          <label for=\"newUserName\">Full name<\/label>\n          <input type=\"text\" id=\"newUserName\" required>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"newUserUsername\">Username<\/label>\n          <input type=\"text\" id=\"newUserUsername\" required>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"newUserRole\">Role<\/label>\n          <select id=\"newUserRole\">\n            <option value=\"bursar\">Bursar<\/option>\n            <option value=\"admin\">Admin<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field full\">\n          <label for=\"newUserPassword\">Password<\/label>\n          <input type=\"text\" id=\"newUserPassword\" required>\n        <\/div>\n      <\/div>\n      <div class=\"error-msg\" id=\"addUserError\">That username is already taken.<\/div>\n      <div style=\"display:flex; gap:10px; margin-top:8px;\">\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:1;\">Add user<\/button>\n        <button type=\"button\" class=\"btn btn-secondary\" id=\"cancelAddUser\">Cancel<\/button>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/div>\n\n<\!-- RESET PASSWORD MODAL -->\n<div class=\"modal-overlay\" id=\"resetPasswordModal\">\n  <div class=\"modal-box\">\n    <h3>Reset password<\/h3>\n    <div class=\"sub\" id=\"resetPasswordSub\">Set a new password for this user.<\/div>\n    <form id=\"resetPasswordForm\">\n      <input type=\"hidden\" id=\"resetPasswordUserId\" value=\"\">\n      <div class=\"field full\">\n        <label for=\"resetPasswordNew\">New password<\/label>\n        <input type=\"text\" id=\"resetPasswordNew\" required>\n      <\/div>\n      <div class=\"hint\">The new password is shown here only once — share it with the user directly, since it isn't emailed or recoverable later.<\/div>\n      <div style=\"display:flex; gap:10px; margin-top:8px;\">\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:1;\">Set new password<\/button>\n        <button type=\"button\" class=\"btn btn-secondary\" id=\"cancelResetPassword\">Cancel<\/button>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/div>\n\n<\!-- ADD STUDENT MODAL -->\n<div class=\"modal-overlay\" id=\"addStudentModal\">\n  <div class=\"modal-box\">\n    <h3>Add a new student<\/h3>\n    <div class=\"sub\">This creates a fee record for the current term.<\/div>\n    <form id=\"addStudentForm\">\n      <div class=\"form-grid\">\n        <div class=\"field full\">\n          <label for=\"newName\">Full name<\/label>\n          <input type=\"text\" id=\"newName\" required>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"newAdm\">Admission no.<\/label>\n          <input type=\"text\" id=\"newAdm\" required>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"newClass\">Class<\/label>\n          <select id=\"newClass\">\n            <option>Form 1<\/option>\n            <option>Form 2<\/option>\n            <option>Form 3<\/option>\n            <option>Form 4<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field full\">\n          <label>Term fee<\/label>\n          <div class=\"static-value\" id=\"newStudentFeePreview\">KES 0<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"hint\">Fees are set per class under Fee Structure, not per student.<\/div>\n      <div style=\"display:flex; gap:10px; margin-top:8px;\">\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:1;\">Add student<\/button>\n        <button type=\"button\" class=\"btn btn-secondary\" id=\"cancelAddStudent\">Cancel<\/button>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n\n  /* Local data layer: the fee module reads and writes the platform's shared store. */\nvar LocalDB=(function(){\n var H=window.parent;\n var KEYS={terms:['id'],fee_structures:['term_id','cls'],students:['id'],payments:['receipt'],profiles:['id'],settings:['id']};\n function db(){var d=H.S.db=H.S.db||{};d.fee_structures=d.fee_structures||[];d.payments=d.payments||[];d.profiles=d.profiles||[];d.auth=d.auth||{};d.settings=d.settings||[{id:1,receipt_counter:0}];return d}\n function get(t){\n  if(t==='students')return H.S.learners.map(function(l){return{id:l.id,name:l.n,adm:l.a,cls:l.g,carry_by_term:l.carry||{}}});\n  if(t==='terms')return H.S.terms.map(function(x,i){return{id:x.id,label:x.t,year:Number(x.y)||x.y,ord:x.ord==null?i+1:x.ord,status:x.status||'closed'}});\n  return db()[t]||(db()[t]=[])}\n function same(t,a,b){return KEYS[t].every(function(c){return a[c]===b[c]})}\n function put(t,r){\n  if(t==='students'){var l=H.S.learners.filter(function(x){return x.id===r.id})[0];if(!l){l={id:r.id,x:'F',p:'',w:''};H.S.learners.push(l)}l.n=r.name;l.a=r.adm;l.g=r.cls;l.carry=r.carry_by_term;return}\n  if(t==='terms'){var x=H.S.terms.filter(function(q){return q.id===r.id})[0];if(!x){x={id:r.id,s:'',e:''};H.S.terms.push(x)}x.t=r.label;x.y=r.year;x.ord=r.ord;x.status=r.status;return}\n  var a=get(t),i=-1;a.forEach(function(q,n){if(same(t,q,r))i=n});if(i>-1)a[i]=r;else a.push(r)}\n function drop(t,rows){\n  if(t==='students'){var ids=rows.map(function(r){return r.id});H.S.learners=H.S.learners.filter(function(l){return ids.indexOf(l.id)<0});ids.forEach(function(i){H.purge&&H.purge(i)});return}\n  if(t==='terms'){var ti=rows.map(function(r){return r.id});H.S.terms=H.S.terms.filter(function(x){return ti.indexOf(x.id)<0});return}\n  db()[t]=get(t).filter(function(q){return !rows.some(function(r){return same(t,q,r)})})}\n function Q(t){var f=[],o=[],rg=null,op='select',pl=null,one=false,q={\n  select:function(){return q},eq:function(c,v){f.push(function(r){return r[c]===v});return q},\n  in:function(c,v){f.push(function(r){return v.indexOf(r[c])>-1});return q},\n  order:function(c){o.push(c);return q},range:function(a,b){rg=[a,b];return q},maybeSingle:function(){one=true;return q},\n  insert:function(r){op='insert';pl=r;return q},upsert:function(r){op='upsert';pl=r;return q},\n  update:function(p){op='update';pl=p;return q},delete:function(){op='delete';return q},\n  then:function(res){try{res(run())}catch(e){res({data:null,error:e})}}};\n  function run(){\n   var rows=get(t).filter(function(r){return f.every(function(fn){return fn(r)})});\n   if(op==='insert'||op==='upsert'){[].concat(pl).forEach(function(r){put(t,r)});H.save();return{data:null,error:null}}\n   if(op==='update'){rows.forEach(function(r){put(t,Object.assign({},r,pl))});H.save();return{data:null,error:null}}\n   if(op==='delete'){drop(t,rows);H.save();return{data:null,error:null}}\n   rows=rows.slice();o.forEach(function(c){rows.sort(function(a,b){return a[c]>b[c]?1:a[c]<b[c]?-1:0})});\n   if(rg)rows=rows.slice(rg[0],rg[1]+1);\n   if(t==='profiles')rows=rows.map(function(r){return{id:r.id,username:r.username,name:r.name,role:r.role}});\n   return{data:one?(rows[0]||null):rows,error:null}}\n  return q}\n function seed(){var d=db();if(!d.profiles.length){d.profiles.push({id:'u_admin',username:'admin',name:'Administrator',role:'admin'});d.auth.u_admin={email:usernameToEmail('admin'),password:'admin123'};H.save()}}\n return{\n  from:Q,\n  rpc:function(n,a){var d=db();\n   if(n==='next_receipt'){d.settings[0].receipt_counter++;H.save();return Promise.resolve({data:d.settings[0].receipt_counter,error:null})}\n   if(n==='admin_delete_user'){d.profiles=d.profiles.filter(function(p){return p.id!==a.target});delete d.auth[a.target];H.save()}\n   if(n==='admin_set_password'&&d.auth[a.target]){d.auth[a.target].password=a.new_password;H.save()}\n   return Promise.resolve({data:null,error:null})},\n  auth:{\n   signInWithPassword:function(c){seed();var d=db(),id=Object.keys(d.auth).filter(function(k){return d.auth[k].email===c.email&&d.auth[k].password===c.password})[0];\n    if(!id)return Promise.resolve({data:null,error:{message:'invalid'}});H.S.session=id;H.save();return Promise.resolve({data:{user:{id:id}},error:null})},\n   signUp:function(c){var d=db(),id='u_'+Date.now().toString(36);d.auth[id]={email:c.email,password:c.password};H.save();return Promise.resolve({data:{user:{id:id}},error:null})},\n   signOut:function(){H.S.session=null;H.save();return Promise.resolve({})},\n   onAuthStateChange:function(){},\n   getSession:function(){seed();var s=H.S.session;return Promise.resolve({data:{session:s&&db().auth[s]?{user:{id:s}}:null}})}}}\n})();\nvar sb=LocalDB;\n\n  var CLASSES = ['Form 1','Form 2','Form 3','Form 4'];\n  var FEE_COMPONENTS = ['Maintenance','Welfare','Tuition','Repair','Activity','Project','Transport'];\n\n  var state = { receiptCounter: 0, users: [], terms: [], feeStructures: [], students: [], payments: [] };\n  var currentUser = null;\n\n  /* ---------------- CLOUD PERSISTENCE (local store) ---------------- */\n  var TABLE_ORDER = ['terms','fee_structures','students','payments'];\n  var TABLE_KEYS  = { terms:['id'], fee_structures:['term_id','cls'], students:['id'], payments:['receipt'] };\n  var snap = { terms:{}, fee_structures:{}, students:{}, payments:{} };\n  var syncing = false, syncPending = false, lastLoadedAt = 0;\n\n  function emptyComponents(){ var z = {}; FEE_COMPONENTS.forEach(function(k){ z[k] = 0; }); return z; }\n\n  function toRows(s){\n    return {\n      terms: s.terms.map(function(t){ return { id:t.id, label:t.label, year:t.year, ord:t.order, status:t.status }; }),\n      fee_structures: s.feeStructures.map(function(f){\n        var comp = {}; FEE_COMPONENTS.forEach(function(k){ comp[k] = Number(f.components && f.components[k]) || 0; });\n        return { term_id:f.termId, cls:f.cls, amount:FEE_COMPONENTS.reduce(function(a,k){ return a + comp[k]; }, 0), components:comp };\n      }),\n      students: s.students.map(function(st){\n        var carry = {}; Object.keys(st.carryByTerm || {}).sort().forEach(function(k){ carry[k] = Number(st.carryByTerm[k]) || 0; });\n        return { id:st.id, name:st.name, adm:st.adm, cls:st.cls, carry_by_term:carry };\n      }),\n      payments: s.payments.map(function(p){\n        return { receipt:p.receipt, student_id:p.studentId, term_id:p.termId, amount:p.amount, method:p.method, paid_on:p.date };\n      })\n    };\n  }\n  function rowKey(table, row){ return TABLE_KEYS[table].map(function(k){ return row[k]; }).join('|'); }\n  function indexRows(rows){\n    var out = {};\n    TABLE_ORDER.forEach(function(t){\n      out[t] = {};\n      rows[t].forEach(function(r){ out[t][rowKey(t, r)] = JSON.stringify(r); });\n    });\n    return out;\n  }\n\n  async function fetchAll(table, orderCols){\n    var out = [], from = 0, size = 1000;\n    while(true){\n      var q = sb.from(table).select('*');\n      orderCols.forEach(function(c){ q = q.order(c); });\n      var r = await q.range(from, from + size - 1);\n      if(r.error) throw r.error;\n      out = out.concat(r.data);\n      if(r.data.length < size) break;\n      from += size;\n    }\n    return out;\n  }\n\n  function normalizeState(s){\n    s.terms.sort(function(a,b){ return a.order - b.order; });\n    s.feeStructures.forEach(function(f){\n      if(!f.components || typeof f.components !== 'object') f.components = emptyComponents();\n      FEE_COMPONENTS.forEach(function(k){ f.components[k] = Number(f.components[k]) || 0; });\n      f.amount = FEE_COMPONENTS.reduce(function(sum,k){ return sum + f.components[k]; }, 0);\n    });\n    if(s.terms.length){\n      var cur = s.terms.filter(function(t){ return t.status === 'current'; });\n      if(cur.length === 0) s.terms[s.terms.length - 1].status = 'current';\n      if(cur.length > 1) cur.slice(1).forEach(function(t){ t.status = 'closed'; });\n      s.terms.forEach(function(t){\n        CLASSES.forEach(function(c){\n          var has = s.feeStructures.some(function(f){ return f.cls === c && f.termId === t.id; });\n          if(!has) s.feeStructures.push({ termId:t.id, cls:c, amount:0, components:emptyComponents() });\n        });\n      });\n    }\n    return s;\n  }\n\n  async function loadAll(){\n    var res = await Promise.all([\n      fetchAll('terms', ['id']),\n      fetchAll('fee_structures', ['term_id','cls']),\n      fetchAll('students', ['id']),\n      fetchAll('payments', ['receipt']),\n      sb.from('settings').select('receipt_counter').eq('id', 1).maybeSingle(),\n      sb.from('profiles').select('id,username,name,role').order('username')\n    ]);\n    if(res[4].error) throw res[4].error;\n    if(res[5].error) throw res[5].error;\n    var s = {\n      receiptCounter: res[4].data ? Number(res[4].data.receipt_counter) : 0,\n      users: res[5].data.map(function(u){ return { id:u.id, name:u.name, username:u.username, role:u.role }; }),\n      terms: res[0].map(function(t){ return { id:Number(t.id), label:t.label, year:Number(t.year), order:Number(t.ord), status:t.status }; }),\n      feeStructures: res[1].map(function(f){ return { termId:Number(f.term_id), cls:f.cls, amount:Number(f.amount) || 0, components:f.components }; }),\n      students: res[2].map(function(st){\n        var carry = {}; var src = st.carry_by_term || {};\n        Object.keys(src).forEach(function(k){ carry[k] = Number(src[k]) || 0; });\n        return { id:Number(st.id), name:st.name, adm:st.adm, cls:st.cls, carryBalance:0, carryByTerm:carry };\n      }),\n      payments: res[3].map(function(p){\n        return { receipt:p.receipt, studentId:Number(p.student_id), termId:Number(p.term_id), amount:Number(p.amount) || 0, method:p.method, date:p.paid_on };\n      })\n    };\n    state = normalizeState(s);\n    snap = indexRows(toRows(state));\n    lastLoadedAt = Date.now();\n  }\n\n  function chunk(arr, n){ var out = []; for(var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }\n\n  async function pushDiff(){\n    var rows = toRows(state);\n    var cur = indexRows(rows);\n    var deletes = {};\n    for(var ti = 0; ti < TABLE_ORDER.length; ti++){\n      var t = TABLE_ORDER[ti];\n      var inserts = [], updates = [];\n      rows[t].forEach(function(r){\n        var k = rowKey(t, r);\n        if(!(k in snap[t])) inserts.push(r);\n        else if(snap[t][k] !== cur[t][k]) updates.push(r);\n      });\n      deletes[t] = Object.keys(snap[t]).filter(function(k){ return !(k in cur[t]); });\n      var chunksI = chunk(inserts, 500);\n      for(var i = 0; i < chunksI.length; i++){\n        var ri = await sb.from(t).insert(chunksI[i]); if(ri.error) throw ri.error;\n      }\n      var chunksU = chunk(updates, 500);\n      for(var j = 0; j < chunksU.length; j++){\n        var ru = await sb.from(t).upsert(chunksU[j], { onConflict: TABLE_KEYS[t].join(',') }); if(ru.error) throw ru.error;\n      }\n    }\n    // deletes: payments first, then students (fee_structures / terms are never deleted by the app)\n    if(deletes.payments.length){\n      var cp = chunk(deletes.payments, 200);\n      for(var a = 0; a < cp.length; a++){ var rp = await sb.from('payments').delete().in('receipt', cp[a]); if(rp.error) throw rp.error; }\n    }\n    if(deletes.students.length){\n      var cs = chunk(deletes.students.map(Number), 200);\n      for(var b = 0; b < cs.length; b++){ var rs = await sb.from('students').delete().in('id', cs[b]); if(rs.error) throw rs.error; }\n    }\n    snap = cur;\n  }\n\n  async function runSync(){\n    if(syncing) return;\n    syncing = true;\n    try{\n      while(syncPending){\n        syncPending = false;\n        await pushDiff();\n      }\n    }catch(e){\n      syncPending = false;\n      showToast('Could not save to the server: ' + (e && e.message ? e.message : 'unknown error') + '. Reloading latest data.');\n      try{ await loadAll(); renderAll(); }catch(e2){}\n    }finally{\n      syncing = false;\n    }\n  }\n  // Same name/meaning as before: call after changing `state`. It now syncs the changes to local store.\n  function save(){\n    if(!currentUser) return;\n    syncPending = true;\n    runSync();\n  }\n  window.addEventListener('beforeunload', function(e){\n    if(syncing || syncPending){ e.preventDefault(); e.returnValue = ''; }\n  });\n\n\n  function esc(v){\n    return String(v == null ? '' : v).replace(/[&<>\"']/g, function(c){\n      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c];\n    });\n  }\n  function todayLocal(){\n    var d = new Date();\n    var m = String(d.getMonth() + 1).padStart(2, '0');\n    var day = String(d.getDate()).padStart(2, '0');\n    return d.getFullYear() + '-' + m + '-' + day;\n  }\n  function fmtKES(n){\n    var sign = n < 0 ? '-' : '';\n    return sign + 'KES ' + Math.round(Math.abs(n)).toLocaleString('en-KE');\n  }\n\n  /* ---------------- TERMS & FEE STRUCTURE HELPERS ---------------- */\n  function getCurrentTerm(){\n    return state.terms.find(function(t){ return t.status === 'current'; }) || state.terms[0];\n  }\n  function getTermById(id){\n    return state.terms.find(function(t){ return t.id === id; });\n  }\n  function termLabel(t){\n    return t ? (t.label + ' ' + t.year) : '—';\n  }\n  function getFeeStructure(cls, termId){\n    return state.feeStructures.find(function(f){ return f.cls === cls && f.termId === termId; });\n  }\n  function feeForClassTerm(cls, termId){\n    var fs = getFeeStructure(cls, termId);\n    if(!fs) return 0;\n    if(fs.components){\n      return FEE_COMPONENTS.reduce(function(sum,k){ return sum + (Number(fs.components[k]) || 0); }, 0);\n    }\n    return Number(fs.amount) || 0;\n  }\n  function feeComponentValue(cls, termId, component){\n    var fs = getFeeStructure(cls, termId);\n    return fs && fs.components ? (Number(fs.components[component]) || 0) : (component === 'Tuition' ? (Number(fs && fs.amount) || 0) : 0);\n  }\n  function dueForStudent(student, termId){\n    var term = termId || getCurrentTerm().id;\n    var base = feeForClassTerm(student.cls, term);\n    var carry = 0;\n    if(student.carryByTerm && Object.prototype.hasOwnProperty.call(student.carryByTerm, term)){\n      carry = Number(student.carryByTerm[term]) || 0;\n    }\n    return base + carry;\n  }\n  function paidByStudent(studentId, termId){\n    var term = termId || getCurrentTerm().id;\n    return state.payments\n      .filter(function(p){ return p.studentId === studentId && p.termId === term; })\n      .reduce(function(sum,p){ return sum + p.amount; }, 0);\n  }\n  function balanceOf(student, termId){\n    var term = termId || getCurrentTerm().id;\n    return Math.round((dueForStudent(student, term) - paidByStudent(student.id, term)) * 100) / 100;\n  }\n  function statusOf(student, termId){\n    var term = termId || getCurrentTerm().id;\n    var bal = balanceOf(student, term);\n    var paid = paidByStudent(student.id, term);\n    if(bal < 0) return 'credit';\n    if(bal === 0) return 'paid';\n    if(paid > 0) return 'partial';\n    return 'unpaid';\n  }\n  function statusLabel(s){\n    if(s === 'paid') return 'Paid';\n    if(s === 'partial') return 'Partial';\n    if(s === 'credit') return 'Credit';\n    return 'Unpaid';\n  }\n\n  function activateTerm(newTermId){\n    var old = getCurrentTerm();\n    var next = getTermById(newTermId);\n    if(!next) return false;\n\n    // Carry a balance forward only when moving to a later term.\n    // Switching back to an older term must never overwrite its own carry.\n    if(old && old.id !== next.id && Number(next.order) > Number(old.order)){\n      state.students.forEach(function(s){\n        var carry = balanceOf(s, old.id);\n        if(!s.carryByTerm || typeof s.carryByTerm !== 'object') s.carryByTerm = {};\n        s.carryByTerm[next.id] = carry;\n      });\n    }\n\n    state.terms.forEach(function(t){\n      t.id = Number(t.id);\n      t.status = Number(t.id) === Number(next.id) ? 'current' : 'closed';\n    });\n    save();\n    return true;\n  }\n\n  /* ---------------- LOGIN (local store AUTH) ---------------- */\n  var loginScreen = document.getElementById('loginScreen');\n  var appShell = document.getElementById('appShell');\n  var loginForm = document.getElementById('loginForm');\n  var loginError = document.getElementById('loginError');\n\n  function usernameToEmail(u){\n    return String(u).trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@' + EMAIL_DOMAIN;\n  }\n\n  async function enterApp(authUser){\n    var p = await sb.from('profiles').select('id,username,name,role').eq('id', authUser.id).maybeSingle();\n    if(p.error) throw p.error;\n    if(!p.data){\n      await sb.auth.signOut();\n      var err = new Error('no-profile'); err.code = 'no-profile'; throw err;\n    }\n    currentUser = { id:p.data.id, name:p.data.name, username:p.data.username, role:p.data.role };\n    try{\n      await loadAll();\n    }catch(e){\n      currentUser = null;\n      throw e;\n    }\n    loginError.style.display = 'none';\n    loginScreen.style.display = 'none';\n    appShell.classList.add('active');\n    applyRoleUI();\n    renderAll();\n  }\n\n  loginForm.addEventListener('submit', async function(e){\n    e.preventDefault();\n    var u = document.getElementById('loginUser').value.trim();\n    var p = document.getElementById('loginPass').value;\n    var btn = loginForm.querySelector('button[type=\"submit\"]');\n    btn.disabled = true;\n    try{\n      var r = await sb.auth.signInWithPassword({ email: usernameToEmail(u), password: p });\n      if(r.error){\n        loginError.textContent = 'Incorrect username or password.';\n        loginError.style.display = 'block';\n        return;\n      }\n      await enterApp(r.data.user);\n    }catch(err){\n      loginError.textContent = (err && err.code === 'no-profile')\n        ? 'This account has no access. Ask the administrator.'\n        : 'Could not connect. Check your internet and try again.';\n      loginError.style.display = 'block';\n    }finally{\n      btn.disabled = false;\n    }\n  });\n\n  document.getElementById('logoutBtn').addEventListener('click', function(){\n    currentUser = null;\n    state = { receiptCounter: 0, users: [], terms: [], feeStructures: [], students: [], payments: [] };\n    snap = { terms:{}, fee_structures:{}, students:{}, payments:{} };\n    sb.auth.signOut();\n    appShell.classList.remove('active');\n    loginScreen.style.display = 'flex';\n    loginForm.reset();\n    document.querySelectorAll('.modal-overlay').forEach(function(m){ m.classList.remove('show'); });\n    document.getElementById('searchResults').classList.remove('show');\n    document.body.classList.remove('admin-mode');\n    document.querySelector('.nav-item[data-view=\"overview\"]').click();\n  });\n\n  // Signed out elsewhere / session expired\n  sb.auth.onAuthStateChange(function(event){\n    if(event === 'SIGNED_OUT' && currentUser) document.getElementById('logoutBtn').click();\n  });\n\n  // Stay signed in across visits\n  sb.auth.getSession().then(function(r){\n    if(r.data && r.data.session) enterApp(r.data.session.user).catch(function(){});\n  });\n\n  function applyRoleUI(){\n    var isAdmin = !!currentUser && currentUser.role === 'admin';\n    document.body.classList.toggle('admin-mode', isAdmin);\n    document.querySelectorAll('.admin-only').forEach(function(el){ el.classList.toggle('role-hidden', !isAdmin); });\n    document.querySelectorAll('.bursar-only').forEach(function(el){ el.classList.toggle('role-hidden', isAdmin); });\n\n    if(!currentUser) return;\n    document.getElementById('sidebarUserName').textContent = currentUser.name + ' (' + (isAdmin ? 'Admin' : 'Bursar') + ')';\n    document.getElementById('sidebarTermLabel').textContent = termLabel(getCurrentTerm());\n    document.getElementById('topbarUserName').textContent = currentUser.name;\n    document.getElementById('topbarRolePill').textContent = isAdmin ? 'Admin' : 'Bursar';\n    var initials = currentUser.name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();\n    document.getElementById('topbarAvatar').textContent = initials;\n    feeStructureEditMode = false;\n    var adminViews = ['terms','users'];\n    if(!isAdmin && adminViews.indexOf(currentActiveView()) > -1){\n      documen    var term = getCurrentTerm();\n    document.getElementById('overviewSub').textContent = 'A live snapshot of fee collection for ' + termLabel(term) + '.';\n    document.getElementById('statTotalStudents').textContent = state.students.length;\n\n    var totalCollected = state.payments.filter(function(p){ return p.termId === term.id; }).reduce(function(s,p){ return s + p.amount; }, 0);\n    var paymentCount = state.payments.filter(function(p){ return p.termId === term.id; }).length;\n    document.getElementById('statCollected').textContent = fmtKES(totalCollected);\n    document.getElementById('statCollectedSub').textContent = paymentCount + ' payments recorded';\n\n    var totalOutstanding = 0, studentsWithBalance = 0, clearedCount = 0;\n    state.students.forEach(function(s){\n      var bal = balanceOf(s);\n      if(bal > 0){ totalOutstanding += bal; studentsWithBalance++; }\n      else clearedCount++;\n    });\n    document.getElementById('statOutstanding').textContent = fmtKES(totalOutstanding);\n    document.getElementById('statOutstandingSub').textContent = studentsWithBalance + ' students with a balance';\n    document.getElementById('statPaidCount').textContent = clearedCount;\n\n    var recent = state.payments.filter(function(p){ return p.termId === term.id; })\n      .slice().sort(function(a,b){ return b.date.localeCompare(a.date) || String(b.receipt).localeCompare(String(a.receipt)); }).slice(0,6);\n    var recentBody = document.getElementById('recentPaymentsBody');\n    recentBody.innerHTML = '';\n    recent.forEach(function(p){\n      var student = state.students.find(function(s){ return s.id === p.studentId; });\n      var tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td>' + esc(p.receipt) + '<\/td>' +\n        '<td>' + esc(student ? student.name : 'Unknown') + '<\/td>' +\n        '<td>' + fmtKES(p.amount) + '<\/td>' +\n        '<td>' + p.date + '<\/td>';\n      recentBody.appendChild(tr);\n    });\n    if(recent.length === 0){\n      recentBody.innerHTML = '<tr><td colspan=\"4\" style=\"color:var(--ink-500); text-align:center; padding:20px;\">No payments recorded yet this term.<\/td><\/tr>';\n    }\n\n    var debtors = state.students\n      .map(function(s){ return { s: s, bal: balanceOf(s) }; })\n      .filter(function(x){ return x.bal > 0; })\n      .sort(function(a,b){ return b.bal - a.bal; })\n      .slice(0,6);\n    var debtorsBody = document.getElementById('topDebtorsBody');\n    debtorsBody.innerHTML = '';\n    debtors.forEach(function(x){\n      var tr = document.createElement('tr');\n      tr.innerHTML = '<td>' + esc(x.s.name) + ' <span style=\"color:var(--ink-500); font-size:12px;\">(' + esc(x.s.cls) + ')<\/span><\/td>' +\n        '<td>' + fmtKES(x.bal) + '<\/td>';\n      debtorsBody.appendChild(tr);\n    });\n    if(debtors.length === 0){\n      debtorsBody.innerHTML = '<tr><td colspan=\"2\" style=\"color:var(--ink-500); text-align:center; padding:20px;\">Everyone is cleared or in credit.<\/td><\/tr>';\n    }\n  }\n\n  /* ---------------- RENDER: STUDENTS ---------------- */\n  function renderStudents(){\n    var textFilter = document.getElementById('studentFilterText').value.trim().toLowerCase();\n    var classFilter = document.getElementById('studentFilterClass').value;\n    var statusFilter = document.getElementById('studentFilterStatus').value;\n\n    var rows = state.students.filter(function(s){\n      var matchesText = !textFilter || s.name.toLowerCase().indexOf(textFilter) > -1 || s.adm.toLowerCase().indexOf(textFilter) > -1;\n      var matchesClass = !classFilter || s.cls === classFilter;\n      var matchesStatus = !statusFilter || statusOf(s) === statusFilter;\n      return matchesText && matchesClass && matchesStatus;\n    });\n\n    var body = document.getElementById('studentsBody');\n    body.innerHTML = '';\n    rows.forEach(function(s){\n      var due = dueForStudent(s);\n      var paid = paidByStudent(s.id);\n      var bal = balanceOf(s);\n      var st = statusOf(s);\n      var isAdmin = currentUser && currentUser.role === 'admin';\n      var tr = document.createElement('tr');\n      tr.innerHTML =\n        '<td>' + esc(s.adm) + '<\/td>' +\n        '<td>' + esc(s.name) + '<\/td>' +\n        '<td>' + esc(s.cls) + '<\/td>' +\n        '<td>' + fmtKES(due) + '<\/td>' +\n        '<td>' + fmtKES(paid) + '<\/td>' +\n        '<td>' + fmtKES(bal) + '<\/td>' +\n        '<td><span class=\"badge ' + st + '\">' + statusLabel(st) + '<\/span><\/td>' +\n        '<td>' + (isAdmin ? '<button type=\"button\" class=\"link-danger\" data-remove-student=\"' + s.id + '\">Remove<\/button>' : '') + '<\/td>';\n      body.appendChild(tr);\n    });\n    if(rows.length === 0){\n      body.innerHTML = '<tr><td colspan=\"8\" style=\"color:var(--ink-500); text-align:center; padding:24px;\">No students match this filter.<\/td><\/tr>';\n    }\n    body.querySelectorAll('[data-remove-student]').forEach(function(btn){\n      btn.addEventListener('click', function(){\n        if(!requireAdmin()) return;\n        var id = parseInt(btn.getAttribute('data-remove-student'), 10);\n        var student = state.students.find(function(s){ return s.id === id; });\n        if(!student) return;\n        if(!confirm('Remove ' + student.name + ' and their payment history? This cannot be undone.')) return;\n        state.students = state.students.filter(function(s){ return s.id !== id; });\n        state.payments = state.payments.filter(function(p){ return p.studentId !== id; });\n        save();\n        showToast('Student removed: ' + student.name);\n        renderAll();\n      });\n    });\n  }\n\n  /* ---------------- ADD STUDENT MODAL ---------------- */\n  var addStudentModal = document.getElementById('addStudentModal');\n  var newClassSelect = document.getElementById('newClass');\n  var newStudentFeePreview = document.getElementById('newStudentFeePreview');\n\n  function updateNewStudentFeePreview(){\n    var term = getCurrentTerm();\n    var fee = feeForClassTerm(newClassSelect.value, term.id);\n    newStudentFeePreview.textContent = fmtKES(fee) + ' for ' + termLabel(term);\n  }\n  newClassSelect.addEventListener('change', updateNewStudentFeePreview);\n\n  document.getElementById('openAddStudent').addEventListener('click', function(){\n    updateNewStudentFeePreview();\n    addStudentModal.classList.add('show');\n  });\n  document.getElementById('cancelAddStudent').addEventListener('click', function(){\n    addStudentModal.classList.remove('show');\n  });\n  addStudentModal.addEventListener('click', function(e){\n    if(e.target === addStudentModal) addStudentModal.classList.remove('show');\n  });\n\n  document.getElementById('addStudentForm').addEventListener('submit', function(e){\n    e.preventDefault();\n    var name = document.getElementById('newName').value.trim();\n    var adm = document.getElementById('newAdm').value.trim();\n    var cls = newClassSelect.value;\n    if(!name || !adm) return;\n\n    var normalizedAdm = adm.toLowerCase();\n    var duplicate = state.students.some(function(student){\n      return String(student.adm).trim().toLowerCase() === normalizedAdm;\n    });\n    if(duplicate){\n      showToast('Admission number already exists.');\n      return;\n    }\n\n    var newId = state.students.length ? Math.max.apply(null, state.students.map(function(s){ return s.id; })) + 1 : 1;\n    state.students.push({ id: newId, name: name, adm: adm, cls: cls, carryBalance: 0, carryByTerm: {} });\n    save();\n\n    this.reset();\n    addStudentModal.classList.remove('show');\n    showToast('Student added: ' + name);\n    renderAll();\n  });\n\n  /* ---------------- RECORD PAYMENT ---------------- */\n  var paymentStudentSelect = document.getElementById('paymentStudent');\n  function renderPaymentStudentOptions(){\n    var current = paymentStudentSelect.value;\n    paymentStudentSelect.innerHTML = '';\n    state.students.forEach(function(s){\n      var opt = document.createElement('option');\n      opt.value = s.id;\n      opt.textContent = s.name + ' — ' + s.adm + ' (' + s.cls + ')';\n      paymentStudentSelect.appendChild(opt);\n    });\n    if(current && state.students.some(function(s){ return String(s.id) === String(current); })) paymentStudentSelect.value = current;\n    updateBalanceNote();\n  }\n  function updateBalanceNote(){\n    var s = state.students.find(function(st){ return st.id == paymentStudentSelect.value; });\n    var note = document.getElementById('paymentStudentBalanceNote');\n    if(!s){ note.textContent = ''; return; }\n    var bal = balanceOf(s);\n    if(bal > 0) note.textContent = 'Current balance: ' + fmtKES(bal) + ' of ' + fmtKES(dueForStudent(s)) + ' billed this term.';\n    else if(bal < 0) note.textContent = 'This student is in credit by ' + fmtKES(Math.abs(bal)) + '.';\n    else note.textContent = 'This student has no outstanding balance for the term.';\n  }\n  paymentStudentSelect.addEventListener('change', updateBalanceNote);\n\n  document.getElementById('paymentForm').addEventListener('submit', async function(e){\n    e.preventDefault();\n    var studentId = parseInt(paymentStudentSelect.value, 10);\n    var amount = parseFloat(document.getElementById('paymentAmount').value);\n    var method = document.getElementById('paymentMethod').value;\n    var student = state.students.find(function(s){ return s.id === studentId; });\n    if(!student || !Number.isFinite(amount) || amount <= 0) {\n      showToast('Enter a valid payment amount.');\n      return;\n    }\n\n    var rc = await sb.rpc('next_receipt');\n    if(rc.error || rc.data == null){\n      showToast('Could not get a receipt number. Check your connection and try again.');\n      return;\n    }\n    state.receiptCounter = Number(rc.data);\n    var receiptNo = 'BRK-' + state.receiptCounter;\n    var today = todayLocal();\n    var payment = { receipt: receiptNo, studentId: studentId, termId: getCurrentTerm().id, amount: amount, method: method, date: today };\n    state.payments.push(payment);\n    save
